name: Dispatch Chrome publication after package upload

on:
  push:
    branches: [main]
    paths:
      - 'platforms/chrome-extension/releases/**/*.zip'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve uploaded version and run fail-closed publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          changed=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.files[].filename' \
            | grep -E '^platforms/chrome-extension/releases/[^/]+/[^/]+\.zip$' \
            | sort -V \
            | tail -n 1)
          test -n "$changed"
          version=$(printf '%s' "$changed" | cut -d/ -f4)
          gh workflow run publish-chrome-package-v2.yml --ref main -f version="$version"
          echo "Dispatched verified publication for Chrome $version"
