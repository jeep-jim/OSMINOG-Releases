name: Import OSMINOG Chrome 3.19.12 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-osminog-31912.yml'

permissions:
  contents: write
  actions: write

env:
  VERSION: '3.19.12'
  PACKAGE: 'OSMINOG-Chrome-3.19.12-SEAMLESS-SHARED-VISION.zip'
  BASE_URL: 'https://github.com/jeep-jim/OSMINOG-Releases/releases/download/chrome-v3.19.11/OSMINOG-Chrome-3.19.11-LIGHT-HOVER-CLOSED-INSPECTOR.zip'
  HERO_SIZE: '1796453'
  HERO_SHA: '0f3bfa90a683f9efe4ca81f28889bd2b29543b7e52469815dd36a281c843214c'

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild 3.19.12 from verified public 3.19.11 base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          curl -fL --retry 3 -o /tmp/base.zip "$BASE_URL"
          unzip -q /tmp/base.zip -d /tmp/pkg
          python scripts/import_31912.py /tmp/pkg
          test "$(stat -c%s /tmp/pkg/assets/core/core-hero-3196.png)" = "$HERO_SIZE"
          test "$(sha256sum /tmp/pkg/assets/core/core-hero-3196.png | awk '{print $1}')" = "$HERO_SHA"
          grep -q 'osminog.vision_context/v1' /tmp/pkg/gpt-presence.js
          grep -q 'SEAMLESS EXTERNAL VISION PREFLIGHT' /tmp/pkg/chatgpt-lite-bridge.js
          grep -q 'prepare:true' /tmp/pkg/chatgpt-lite-bridge.js
          grep -q 'BC_LITE_EXTERNAL_USER' /tmp/pkg/background.js
          grep -q 'EXTERNAL_AUTO_KEY' /tmp/pkg/bridge.js
          grep -q 'seamlessVision:true' /tmp/pkg/bridge.js
          grep -q 'class="inspector glass collapsed"' /tmp/pkg/editor.html
          grep -q 'LIGHT PRIMARY HOVER + CLOSED INSPECTOR' /tmp/pkg/osminog-product-core-recovery.css
          grep -q 'margin-top:-10px!important' /tmp/pkg/editor.css
          node --check /tmp/pkg/gpt-presence.js
          node --check /tmp/pkg/chatgpt-lite-bridge.js
          node --check /tmp/pkg/background.js
          node --check /tmp/pkg/bridge.js
          python -m json.tool /tmp/pkg/manifest.json >/dev/null
          test "$(python -c 'import json;print(json.load(open("/tmp/pkg/manifest.json"))["version"])')" = "$VERSION"
          python - <<'PY'
          import hashlib,json
          m=json.load(open('/tmp/pkg/manifest.json',encoding='utf-8'))
          assert hashlib.sha256((m.get('key') or '').encode()).hexdigest() == '1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e'
          PY
          (cd /tmp/pkg && zip -qr "$GITHUB_WORKSPACE/$PACKAGE" .)
          unzip -t "$PACKAGE" >/dev/null

      - name: Register immutable 3.19.12 package
        shell: bash
        run: |
          set -euo pipefail
          release_dir="platforms/chrome-extension/releases/$VERSION"
          mkdir -p "$release_dir"
          cp "$PACKAGE" "$release_dir/$PACKAGE"
          size=$(stat -c%s "$release_dir/$PACKAGE")
          sha=$(sha256sum "$release_dir/$PACKAGE" | awk '{print $1}')
          python - "$release_dir/release-v2.json" "$size" "$sha" <<'PY'
          import json,pathlib,sys
          out,size,sha=sys.argv[1:4]
          meta={'schema':'osminog-release/v2','product':'OSMINOG','platform':'chrome-extension','version':'3.19.12','codename':'SEAMLESS SHARED VISION','baseVersion':'3.19.11','package':'OSMINOG-Chrome-3.19.12-SEAMLESS-SHARED-VISION.zip','size':int(size),'sha256':sha,'manifestVersion':'3.19.12','fixedExtensionKeyRequired':True,'fixedIdentitySha256':'1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e','minDevHubVersion':'2.0.0','runtimeVerified':False,'notes':'Shared same-revision OSMINOG Vision Context for all connected providers. External ChatGPT Presence now intercepts natural canvas-look requests, asks the live editor for fresh structured context plus a viewport/selection/object/overview capture, attaches that image before the user turn is sent, hides machine context/tool hops, and silently reconnects to an existing previously-authorized ChatGPT tab. All 3.19.11 hero, localization, provider, canvas, hover and closed-inspector fixes are preserved.','publishedAt':None}
          pathlib.Path(out).write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cat > "$release_dir/README.md" <<'EOF'
          # OSMINOG Chrome 3.19.12 — Seamless Shared Vision

          - one same-revision Vision Context is shared by ChatGPT, Claude, Gemini, DeepSeek and other OSMINOG provider turns;
          - external ChatGPT Presence preflights natural phrases such as “смотри на холст / что видишь” before the message is sent;
          - the live OSMINOG editor returns fresh structured context and the matching viewport / selection / object / overview image;
          - the image is attached automatically to the exact external ChatGPT turn; no manual screenshot is required;
          - machine context and tool-result hops are kept inside hidden protocol blocks instead of cluttering the visible chat;
          - a previously-authorized external ChatGPT Presence silently reconnects to an existing tab after OSMINOG reload; no new ChatGPT tab is created;
          - original hero PNG and all 3.19.11 UI fixes are preserved.

          Runtime verification requires the owner to update and type “смотри на холст” in the attached ChatGPT tab. The expected result is a normal assistant answer based on the current OSMINOG canvas without manually uploading a screenshot.
          EOF

      - name: Commit registry and cleanup importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-osminog-31912.yml scripts/import_31912.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import OSMINOG Chrome 3.19.12 package [skip ci]'
          git push origin HEAD:main

      - name: Dispatch verified publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish-chrome-package-v2.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"
