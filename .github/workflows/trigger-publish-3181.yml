name: Trigger OSMINOG Chrome 3.18.1 publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-publish-3181.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified 3.18.1 publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish-chrome-package-v2.yml --repo "$GITHUB_REPOSITORY" --ref main -f version='3.18.1'
          echo 'Dispatched fail-closed publisher for OSMINOG Chrome 3.18.1'
