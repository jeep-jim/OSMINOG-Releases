name: Import OSMINOG Chrome 3.19.6 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-osminog-3196.yml'

permissions:
  contents: write
  actions: write

env:
  VERSION: '3.19.6'
  PACKAGE: 'OSMINOG-Chrome-3.19.6-CINEMATIC-CORE-HERO.zip'
  BASE_URL: 'https://github.com/jeep-jim/OSMINOG-Releases/releases/download/chrome-v3.19.5/OSMINOG-Chrome-3.19.5-SPLIT-CORE-HERO-NATIVE-DROP.zip'
  HERO_URL: 'https://oaisdmntprnortheu.blob.core.windows.net/files/00000000-8a50-81f4-9f55-a641818ab00d/raw?se=2026-09-04T08%3A32%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=01a06b65-b545-735b-ab6b-06df35ad9dad&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T06%3A35%3A37Z&ske=2026-09-05T06%3A35%3A37Z&sks=b&skv=2026-02-06&sig=DTBYwO9Fkcm40OR6l4gWXQt%2BAAI/JyKYvoLfJKyXC8M%3D'
  HERO_SIZE: '1796453'
  HERO_SHA: '0f3bfa90a683f9efe4ca81f28889bd2b29543b7e52469815dd36a281c843214c'

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild 3.19.6 from verified public 3.19.5 base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          curl -fL --retry 3 -o /tmp/base.zip "$BASE_URL"
          unzip -q /tmp/base.zip -d /tmp/pkg
          curl -fL --retry 3 -o /tmp/hero.png "$HERO_URL"
          test "$(stat -c%s /tmp/hero.png)" = "$HERO_SIZE"
          test "$(sha256sum /tmp/hero.png | awk '{print $1}')" = "$HERO_SHA"
          cp /tmp/hero.png /tmp/pkg/assets/core/core-hero-3196.png

          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/pkg')
          h=root/'editor.html'
          s=h.read_text(encoding='utf-8')
          old='''        <img class="core-hero-human" src="assets/core/hero-human-3195.webp" alt="" aria-hidden="true">\n        <img class="core-hero-octopus" src="assets/core/hero-octopus-ai-3195.webp" alt="" aria-hidden="true">'''
          new='''        <img class="core-hero-composite core-hero-composite-back" src="assets/core/core-hero-3196.png" alt="" aria-hidden="true">\n        <img class="core-hero-composite core-hero-composite-front" src="assets/core/core-hero-3196.png" alt="" aria-hidden="true">'''
          assert old in s
          h.write_text(s.replace(old,new,1),encoding='utf-8')

          c=root/'editor.css'
          s=c.read_text(encoding='utf-8')
          marker='/* OSMINOG 3.19.5 · SPLIT CORE HERO */'
          assert marker in s
          s=s[:s.index(marker)].rstrip()+r'''

          /* OSMINOG 3.19.6 · CINEMATIC CORE HERO */
          .core-hero-launch{position:absolute!important;overflow:visible!important;isolation:isolate!important;width:min(680px,68vw)!important;max-width:680px!important;margin-top:174px!important;padding:38px 36px 28px!important;border:0!important;border-radius:28px!important;background:transparent!important;box-shadow:none!important;text-align:center!important}
          .core-hero-launch::before{content:"";position:absolute;z-index:0;left:50%;top:-390px;width:min(1240px,96vw);height:690px;transform:translateX(-50%);background:radial-gradient(ellipse at center,color-mix(in srgb,var(--accent) 18%,transparent) 0,transparent 68%);filter:blur(24px);pointer-events:none}
          .core-hero-launch::after{content:"";position:absolute;z-index:2;inset:0;border-radius:28px;border:1px solid color-mix(in srgb,var(--line) 92%,transparent);background:color-mix(in srgb,var(--surface) 96%,transparent);box-shadow:0 28px 78px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.04);backdrop-filter:blur(18px) saturate(1.08);pointer-events:none}
          .core-hero-composite{position:absolute!important;left:50%!important;top:0!important;z-index:1!important;width:min(1180px,94vw)!important;height:auto!important;max-width:none!important;transform:translate(-50%,-58%)!important;object-fit:contain!important;image-rendering:auto!important;pointer-events:none!important;user-select:none!important;-webkit-user-drag:none!important;filter:drop-shadow(0 20px 38px rgba(0,0,0,.30))!important;will-change:transform}
          .core-hero-composite-front{z-index:6!important;clip-path:inset(0 64% 0 0);filter:drop-shadow(0 18px 30px rgba(0,0,0,.22))!important}
          .core-hero-launch>:not(.core-hero-composite){position:relative;z-index:4}
          .core-hero-launch>.empty-hint-close{position:absolute!important;z-index:9!important;top:14px!important;right:14px!important;left:auto!important}
          .core-hero-launch .hint-orb{margin-bottom:14px!important}.core-hero-launch .empty-kicker{letter-spacing:.16em!important}.core-hero-launch h2{max-width:590px!important;margin:12px auto 10px!important;font-size:clamp(30px,3.25vw,44px)!important;line-height:1.04!important}.core-hero-launch p{max-width:600px!important;margin:0 auto 22px!important;font-size:13px!important;line-height:1.55!important}
          .core-hero-launch .empty-launch-actions{display:flex!important;justify-content:center!important;align-items:center!important;gap:14px!important;margin:0 auto 14px!important;flex-wrap:nowrap!important}.core-hero-launch .empty-launch-actions>button{height:50px!important;min-width:0!important;padding:0 22px!important;border-radius:14px!important;font-size:14px!important;font-weight:760!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}.core-hero-launch .empty-launch-actions>.primary-btn{background:linear-gradient(120deg,#526fff 0%,#7657ff 100%)!important;box-shadow:0 12px 28px rgba(82,111,255,.26),inset 0 1px 0 rgba(255,255,255,.18)!important}
          .core-hero-launch .empty-provider-row{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:10px!important;width:100%!important;margin:0 auto!important}.core-hero-launch .empty-provider-row>button{height:42px!important;min-width:0!important;padding:0 13px!important;border:1px solid var(--line)!important;border-radius:13px!important;background:color-mix(in srgb,var(--surface-2) 88%,transparent)!important;color:var(--text)!important;display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:8px!important;font-weight:720!important;font-size:13px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.035)!important}.core-hero-launch .empty-provider-row>button:hover{background:var(--surface-3)!important;border-color:var(--line-strong)!important;transform:translateY(-1px)}.core-hero-launch .empty-provider-row img{width:24px!important;height:24px!important;flex:0 0 24px!important}
          @keyframes coreHero3196Float{0%,100%{translate:0 0}50%{translate:0 -4px}}.core-hero-composite-back,.core-hero-composite-front{animation:coreHero3196Float 7s ease-in-out infinite}
          @media(max-width:1100px){.core-hero-launch{width:min(620px,72vw)!important;margin-top:150px!important;padding:34px 30px 26px!important}.core-hero-composite{width:min(1040px,96vw)!important;transform:translate(-50%,-56%)!important}.core-hero-composite-front{clip-path:inset(0 63% 0 0)}}
          @media(max-width:820px){.core-hero-launch{width:min(560px,82vw)!important;margin-top:122px!important;padding:30px 24px 24px!important}.core-hero-composite{width:min(850px,110vw)!important;transform:translate(-50%,-52%)!important}.core-hero-composite-front{clip-path:inset(0 62% 0 0)}.core-hero-launch .empty-launch-actions{gap:8px!important;flex-wrap:wrap!important}.core-hero-launch .empty-launch-actions>button{height:44px!important;padding:0 15px!important}.core-hero-launch .empty-provider-row{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
          @media(max-height:760px) and (min-width:821px){.core-hero-launch{margin-top:120px!important;transform:translate(-50%,-43%)!important}.core-hero-composite{width:min(1040px,90vw)!important;transform:translate(-50%,-55%)!important}}
          @media(prefers-reduced-motion:reduce){.core-hero-composite{animation:none!important}}
          '''+'\n'
          c.write_text(s,encoding='utf-8')

          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'));m['version']='3.19.6';m['version_name']='3.19.6';(root/'manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          b=json.loads((root/'OSMINOG_BUILD.json').read_text(encoding='utf-8'));b.update({'version':'3.19.6','versionName':'3.19.6','build':'3.19.6','codename':'CINEMATIC CORE HERO','baseVersion':'3.19.5','artifact':'OSMINOG-Chrome-3.19.6-CINEMATIC-CORE-HERO.zip','manifestVersion':'3.19.6','binaryInGitHub':True,'release':'CINEMATIC-CORE-HERO','notes':'Owner-approved 1672x941 RGBA hero preserved byte-for-byte; real launch card masks the octopus while the human leg stays above it; compact launch buttons and five-provider row.'});(root/'OSMINOG_BUILD.json').write_text(json.dumps(b,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          test "$(python -c 'import json;print(json.load(open("/tmp/pkg/manifest.json"))["version"])')" = "$VERSION"
          grep -q 'core-hero-3196.png' /tmp/pkg/editor.html
          grep -q 'right:14px!important;left:auto!important' /tmp/pkg/editor.css
          grep -q 'repeat(5,minmax(0,1fr))' /tmp/pkg/editor.css
          node --check /tmp/pkg/editor.js
          python -m json.tool /tmp/pkg/manifest.json >/dev/null
          (cd /tmp/pkg && zip -qr "$GITHUB_WORKSPACE/$PACKAGE" .)
          unzip -t "$PACKAGE" >/dev/null

      - name: Register immutable 3.19.6 package
        shell: bash
        run: |
          set -euo pipefail
          release_dir="platforms/chrome-extension/releases/$VERSION"
          mkdir -p "$release_dir"
          cp "$PACKAGE" "$release_dir/$PACKAGE"
          size=$(stat -c%s "$release_dir/$PACKAGE")
          sha=$(sha256sum "$release_dir/$PACKAGE" | awk '{print $1}')
          python - "$release_dir/release-v2.json" "$size" "$sha" <<'PY'
          import json,pathlib,sys
          out,size,sha=sys.argv[1:4]
          meta={'schema':'osminog-release/v2','product':'OSMINOG','platform':'chrome-extension','version':'3.19.6','codename':'CINEMATIC CORE HERO','baseVersion':'3.19.5','package':'OSMINOG-Chrome-3.19.6-CINEMATIC-CORE-HERO.zip','size':int(size),'sha256':sha,'manifestVersion':'3.19.6','fixedExtensionKeyRequired':True,'fixedIdentitySha256':'1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e','minDevHubVersion':'2.0.0','runtimeVerified':False,'notes':'Cinematic startup hero: exact 1672x941 RGBA owner art; octopus behind the real launch card, human leg above it, close button fixed top-right, compact action buttons and five AI provider pills.','publishedAt':None}
          pathlib.Path(out).write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cat > "$release_dir/README.md" <<'EOF'
          # OSMINOG Chrome 3.19.6 — Cinematic Core Hero
          Exact owner-approved 1672x941 RGBA hero. The octopus is masked by the real launch card, the human leg remains above the card, close stays top-right, and launch/provider buttons match the approved compact menu.
          EOF

      - name: Commit registry and cleanup importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-osminog-3196.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import OSMINOG Chrome 3.19.6 package [skip ci]'
          git push origin HEAD:main

      - name: Dispatch verified publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish-chrome-package-v2.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"
