name: Import OSMINOG Chrome 3.16.0 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-osminog-3160.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify 3.16.0 package
        shell: bash
        run: |
          set -euo pipefail
          url='https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-63c0-8210-87ed-0866a10e34cc/raw?se=2026-09-03T06%3A23%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=6c8793ae-74f3-5fbe-a642-9bebfc8b2f98&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-03T04%3A33%3A15Z&ske=2026-09-04T04%3A33%3A15Z&sks=b&skv=2026-02-06&sig=7iVOHih3iXjTrpCT19MYQbYiq/M8V0002VXO9Z7l8Rc%3D'
          curl -fL --retry 3 "$url" -o artifact.zip
          rm -rf unpacked && mkdir unpacked
          unzip -q artifact.zip -d unpacked
          inner=$(find unpacked -type f -name 'OSMINOG-Chrome-3.16.0-SIMPLE-ACCESS-RUNTIME.zip' | head -n 1)
          test -n "$inner"
          test "$(stat -c%s "$inner")" = '578416'
          test "$(sha256sum "$inner" | awk '{print $1}')" = '840adfc1f8cbfbf04b0727e3b447d0724c4581133e2d7d71632665a1f77ee0bd'
          python - "$inner" <<'PY'
          import json,sys,zipfile,hashlib
          p=sys.argv[1]
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read('manifest.json'))
              assert m['name']=='OSMINOG'
              assert m['version']=='3.16.0' and m['version_name']=='3.16.0'
              assert hashlib.sha256(m['key'].encode()).hexdigest()=='1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e'
              for f in ['bridge.js','gpt-presence.js','modules.js','osminog-access-center.js','osminog-owner-guard.js']:
                  assert f in z.namelist()
          PY
          dir='platforms/chrome-extension/releases/3.16.0'
          package='OSMINOG-Chrome-3.16.0-SIMPLE-ACCESS-RUNTIME.zip'
          mkdir -p "$dir"
          cp "$inner" "$dir/$package"
          cat > "$dir/release-v2.json" <<'JSON'
          {
            "schema":"osminog-release/v2",
            "product":"OSMINOG",
            "platform":"chrome-extension",
            "version":"3.16.0",
            "codename":"SIMPLE ACCESS RUNTIME",
            "baseVersion":"3.15.2",
            "package":"OSMINOG-Chrome-3.16.0-SIMPLE-ACCESS-RUNTIME.zip",
            "size":578416,
            "sha256":"840adfc1f8cbfbf04b0727e3b447d0724c4581133e2d7d71632665a1f77ee0bd",
            "manifestVersion":"3.16.0",
            "fixedExtensionKeyRequired":true,
            "fixedIdentitySha256":"1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e",
            "minDevHubVersion":"2.0.0",
            "runtimeVerified":false,
            "notes":"Simple permanent workspace capabilities, sharing-only Access, intent-driven lazy canvas context and just-in-time Owner Unlock with Google Authenticator-compatible TOTP for product source mutations."
          }
          JSON
          cat > "$dir/README.md" <<'MD'
          # OSMINOG Chrome 3.16.0 — SIMPLE ACCESS RUNTIME

          OSMINOG returns to a simple capability model.

          - normal canvas, file, app, module, browser, graphics and project work is always available to the connected AI; there is no Poseidon or AI-edit permission toggle;
          - **Access** contains only canvas sharing: visibility, share link and view/comment/edit role;
          - the connector is automatic, but normal chat prompts do not preload the canvas/project; context is requested only when the user explicitly mentions the canvas/project/desktop/selection, attaches an object or uses a tether;
          - the same lazy-context policy applies to built-in Google AI and external ChatGPT Presence;
          - changing the private OSMINOG product source is a just-in-time privileged action, not a user setting;
          - first Owner Unlock verifies the local GitHub credential against `jeep-jim/OSMINOG` and `jeep-jim/OSMINOG-Releases`, then enrolls a Google Authenticator-compatible TOTP secret; future source actions require the six-digit code and unlock for 15 minutes;
          - GitHub credentials and TOTP codes are never inserted into AI chat text.

          Security boundary: this release uses standard TOTP compatible with Google Authenticator. True push approval requires an external identity/backend service and is not claimed here.

          Package SHA-256: `840adfc1f8cbfbf04b0727e3b447d0724c4581133e2d7d71632665a1f77ee0bd`
          Package bytes: `578416`
          Source commit: `1f6bee0f4b8cc1de6a6d62d6dc39ec7ee657732a`
          MD
      - name: Archive package and metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platforms/chrome-extension/releases/3.16.0
          git commit -m 'Archive OSMINOG Chrome 3.16.0 package'
          git push origin HEAD:main
