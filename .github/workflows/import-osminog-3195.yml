name: Import OSMINOG Chrome 3.19.5 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-osminog-3195.yml'

permissions:
  contents: write
  actions: write

env:
  VERSION: '3.19.5'
  PACKAGE: 'OSMINOG-Chrome-3.19.5-SPLIT-CORE-HERO-NATIVE-DROP.zip'
  BASE_URL: 'https://github.com/jeep-jim/OSMINOG-Releases/releases/download/chrome-v3.19.3/OSMINOG-Chrome-3.19.3-GRAPHICS-STABILITY-NATIVE-DROP.zip'

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release registry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild package from verified 3.19.3 public base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          curl -fL --retry 3 -o /tmp/base.zip "$BASE_URL"
          unzip -q /tmp/base.zip -d /tmp/pkg
          base_key=$(python - <<'PY'
          import json,zipfile
          with zipfile.ZipFile('/tmp/base.zip') as z:
              print(json.loads(z.read('manifest.json'))['key'])
          PY
          )
          base_identity=$(python - <<'PY'
          import hashlib,json,zipfile
          with zipfile.ZipFile('/tmp/base.zip') as z:
              key=json.loads(z.read('manifest.json'))['key']
          print(hashlib.sha256(key.encode()).hexdigest())
          PY
          )
          test "$base_identity" = '1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e'

          (cd /tmp/pkg && python "$GITHUB_WORKSPACE/staging/chrome-extension/3.19.5/hotfix.py")

          test "$(python -c 'import json;print(json.load(open("/tmp/pkg/manifest.json"))["version"])')" = "$VERSION"
          test "$(python -c 'import json;print(json.load(open("/tmp/pkg/manifest.json"))["version_name"])')" = "$VERSION"
          test "$(python -c 'import json;print(json.load(open("/tmp/pkg/manifest.json"))["key"])')" = "$base_key"
          test "$(stat -c%s /tmp/pkg/assets/core/hero-human-3195.webp)" -gt 40000
          test "$(stat -c%s /tmp/pkg/assets/core/hero-octopus-ai-3195.webp)" -eq 44520
          test "$(sha256sum /tmp/pkg/assets/core/hero-octopus-ai-3195.webp | awk '{print $1}')" = 'c212e02dfd2cc8fb29080da447dedb77cabe5ead63410e8968207cf63cb46260'
          grep -q 'hero-human-3195.webp' /tmp/pkg/editor.html
          grep -q 'hero-octopus-ai-3195.webp' /tmp/pkg/editor.html
          grep -q 'OSMINOG 3.19.5 · SPLIT CORE HERO' /tmp/pkg/editor.css
          grep -q 'nativeDropBusy' /tmp/pkg/editor.js
          ! grep -q 'OSMINOG 3.19.3 · native desktop file drop recovery' /tmp/pkg/editor.js
          ! grep -q 'osminog-native-file-drag' /tmp/pkg/editor.css
          ! grep -q 'briefCraftLastCachedImage:src' /tmp/pkg/editor.js
          node --check /tmp/pkg/editor.js
          node --check /tmp/pkg/osminog-graphics-studio.js
          python -m json.tool /tmp/pkg/manifest.json >/dev/null
          python -m json.tool /tmp/pkg/OSMINOG_BUILD.json >/dev/null

          (cd /tmp/pkg && zip -qr "$GITHUB_WORKSPACE/$PACKAGE" .)
          unzip -t "$PACKAGE" >/dev/null

      - name: Register immutable 3.19.5 package
        shell: bash
        run: |
          set -euo pipefail
          release_dir="platforms/chrome-extension/releases/$VERSION"
          mkdir -p "$release_dir"
          cp "$PACKAGE" "$release_dir/$PACKAGE"
          size=$(stat -c%s "$release_dir/$PACKAGE")
          sha=$(sha256sum "$release_dir/$PACKAGE" | awk '{print $1}')

          python - "$release_dir/release-v2.json" "$size" "$sha" <<'PY'
          import json,pathlib,sys
          out,size,sha=sys.argv[1:4]
          meta={
            'schema':'osminog-release/v2',
            'product':'OSMINOG',
            'platform':'chrome-extension',
            'version':'3.19.5',
            'codename':'SPLIT CORE HERO',
            'baseVersion':'3.19.3-public / 3.19.4-source',
            'package':'OSMINOG-Chrome-3.19.5-SPLIT-CORE-HERO-NATIVE-DROP.zip',
            'size':int(size),
            'sha256':sha,
            'manifestVersion':'3.19.5',
            'fixedExtensionKeyRequired':True,
            'fixedIdentitySha256':'1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e',
            'minDevHubVersion':'2.0.0',
            'runtimeVerified':False,
            'notes':'Split startup hero: approved human layer on the left and red OSMINOG/AI layer above-right of the real launch card. Decorative banana/stars and the duplicate capture-level file-drop runtime are removed; one guarded native viewport drop path is preserved.',
            'publishedAt':None,
          }
          pathlib.Path(out).write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          cat > "$release_dir/README.md" <<'EOF'
          # OSMINOG Chrome 3.19.5 — Split Core Hero

          - approved transparent human layer sits to the left of the real launch card;
          - approved red OSMINOG + AI layer sits above/right of the card;
          - hero art does not intercept clicks and scales down responsively;
          - banana/stars and the old combined hero are not used;
          - duplicate capture-level desktop drop logic is removed;
          - one guarded viewport-native file drop path is kept from the 3.19.4 recovery.

          Runtime UI verification is intentionally left to the owner after updating in Chrome.
          EOF

      - name: Commit registry and cleanup staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging/chrome-extension/3.19.5
          rm -f .github/workflows/import-osminog-3195.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import OSMINOG Chrome 3.19.5 package [skip ci]'
          git push origin HEAD:main

      - name: Dispatch verified publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish-chrome-package-v2.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"
