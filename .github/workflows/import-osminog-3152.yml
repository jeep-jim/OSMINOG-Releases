name: Import OSMINOG Chrome 3.15.2 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-osminog-3152.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify 3.15.2 package
        shell: bash
        run: |
          set -euo pipefail
          url='https://sdmntprnortheu.oaiusercontent.com/files/00000000-eee4-81f4-8ad7-0b29e8d740fb/raw?se=2026-09-03T05%3A26%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=9715fb20-1448-563f-8ab4-00b0a80fc32e&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T18%3A42%3A03Z&ske=2026-09-03T18%3A42%3A03Z&sks=b&skv=2026-02-06&sig=MRcHyRl9X%2B6G5DVDgsuw29gvYefm6ot4kZLHJoT1RRk%3D'
          curl -fL --retry 3 "$url" -o artifact.zip
          rm -rf unpacked && mkdir unpacked
          unzip -q artifact.zip -d unpacked
          inner=$(find unpacked -type f -name 'OSMINOG-Chrome-3.15.2-GITHUB-OWNER-STATUS-SYNC.zip' | head -n 1)
          test -n "$inner"
          test "$(stat -c%s "$inner")" = '583112'
          test "$(sha256sum "$inner" | awk '{print $1}')" = '7d022e78cb0a52d22d176e4ebcd8ea2ed1ad4e739be8bec2da17ac5412b66534'
          python - "$inner" <<'PY'
          import json,sys,zipfile,hashlib
          p=sys.argv[1]
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read('manifest.json'))
              assert m['name']=='OSMINOG'
              assert m['version']=='3.15.2' and m['version_name']=='3.15.2'
              assert hashlib.sha256(m['key'].encode()).hexdigest()=='1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e'
              for f in ['background.js','bridge.js','modules.js','osminog-access-center.js']:
                  assert f in z.namelist()
          PY
          dir='platforms/chrome-extension/releases/3.15.2'
          package='OSMINOG-Chrome-3.15.2-GITHUB-OWNER-STATUS-SYNC.zip'
          mkdir -p "$dir"
          cp "$inner" "$dir/$package"
          cat > "$dir/release-v2.json" <<'JSON'
          {
            "schema":"osminog-release/v2",
            "product":"OSMINOG",
            "platform":"chrome-extension",
            "version":"3.15.2",
            "codename":"GITHUB OWNER STATUS SYNC",
            "baseVersion":"3.15.1",
            "package":"OSMINOG-Chrome-3.15.2-GITHUB-OWNER-STATUS-SYNC.zip",
            "size":583112,
            "sha256":"7d022e78cb0a52d22d176e4ebcd8ea2ed1ad4e739be8bec2da17ac5412b66534",
            "manifestVersion":"3.15.2",
            "fixedExtensionKeyRequired":true,
            "fixedIdentitySha256":"1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e",
            "minDevHubVersion":"2.0.0",
            "runtimeVerified":false,
            "notes":"Unifies GitHub account, repository access and Owner Max verification across Modules, Control Center, Presence and Poseidon."
          }
          JSON
          cat > "$dir/README.md" <<'MD'
          # OSMINOG Chrome 3.15.2 — GITHUB OWNER STATUS SYNC

          - GitHub is no longer shown as fully connected merely because the token can call `/user`;
          - Owner Max verifies both `jeep-jim/OSMINOG` and `jeep-jim/OSMINOG-Releases`;
          - a private-repository 404 is shown as missing fine-grained Repository access, with the exact repositories to add;
          - write access is required on both product repositories before Poseidon gets Owner Max;
          - Modules, Control Center, Presence and `module_status` now use the same local `osminogOwnerGrantV1` status;
          - account-only tokens are labeled `GitHub аккаунт · Owner не подтверждён` instead of a misleading connected state.

          No GitHub token is copied into AI chat messages.

          Package SHA-256: `7d022e78cb0a52d22d176e4ebcd8ea2ed1ad4e739be8bec2da17ac5412b66534`
          Package bytes: `583112`
          Source commit: `602b7d8b4bb7064c2376e7c023f83e82ed23c7e6`
          MD
      - name: Archive package and metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platforms/chrome-extension/releases/3.15.2
          git commit -m 'Archive OSMINOG Chrome 3.15.2 package'
          git push origin HEAD:main
