name: Publish verified Mouse Browser 6.0.35 Windows x64
on:
  pull_request:
    paths: ['.gitattributes','tools/mouse635-*.py','tools/test_mouse635_*.py','tools/test-mouse635-*.py','.github/workflows/publish-mouse635-windows.yml','staging/mouse/6.0.35-windows-x64/**']
  push:
    branches: [main]
    paths: ['staging/mouse/6.0.35-windows-x64/PUBLISH_OWNER', '.github/workflows/publish-mouse635-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify current635 frozen reuse and native predicates
        run: python3 tools/test_mouse635_reuse.py -v
      - name: Verify publication refuses incomplete evidence
        run: python3 tools/test_mouse635_windows_release.py -v
      - name: Verify actual published634 profile replacement evidence
        run: python3 tools/test_mouse635_upgrade_evidence.py -v
      - name: Verify task and fifty-tab native evidence contracts
        run: python3 tools/test_mouse635_task_evidence.py -v
      - name: Verify native process report and immutable byte bindings
        run: python3 tools/test_mouse635_native_report.py -v
      - name: Verify hidden scrollbars preserve native scrolling
        run: python3 tools/test-mouse635-ui-evidence.py -v
      - name: Verify native settings, Agent, zoom and import witnesses
        run: python3 tools/test_mouse635_633_owner_evidence.py -v
      - name: Verify current634 downloads, preview, capture and focused chrome
        run: python3 tools/test_mouse635_retained_owner_evidence.py -v
      - name: Verify native context menus and private favorite isolation
        run: python3 tools/test_mouse635_context_evidence.py -v
      - name: Verify current media, document viewer and footer evidence
        run: python3 tools/test_mouse635_feedback_evidence.py -v
      - name: Verify workspace spacing, all corners and native input
        run: python3 tools/test_mouse635_workspace_evidence.py -v
      - name: Verify current635 search UI, request states and metadata privacy
        run: python3 tools/test_mouse635_search_evidence.py -v
      - name: Reject empty, irrelevant or fabricated public API results
        run: python3 tools/test_mouse635_public_search_evidence.py -v
      - name: Verify stable real file DOM and actual replacement bytes
        run: python3 tools/test_mouse635_library_evidence.py -v
      - name: Verify real Agent chat input, conversation and native frames
        run: python3 tools/test_mouse635_agent_chat_evidence.py -v
      - name: Verify native layout menu and explicit pinned-pane guards
        run: python3 tools/test_mouse635_pane_layout_evidence.py -v
      - name: Bind the separate installed635 process and all mandatory gates
        run: python3 tools/test_mouse635_owner_feedback_evidence.py -v
  publish-windows:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 55
    permissions:
      contents: write
    concurrency:
      group: mouse-windows-x64-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve exact publisher source bytes on Windows
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import immutable successful Windows CI installer
        run: python tools/mouse635-windows-release.py import
      - name: Verify exact installer on a fresh Windows machine
        env:
          MOUSE_TEST_BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: python tools/mouse635-windows-release.py verify
      - name: Publish and verify immutable public asset
        run: python tools/mouse635-windows-release.py publish
      - name: Advance Windows feed and verify anonymous discovery and download
        run: python tools/mouse635-windows-release.py channel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse635-windows-release-verification-${{ github.run_attempt }}
          path: |
            mouse635-windows-release/*.json
            mouse635-windows-release/*.log
            mouse635-windows-release/*.png
            mouse635-windows-release/mouse-631-upgrade/**
            mouse635-windows-release/SHA256SUMS.txt
            mouse635-windows-release/RELEASE_NOTES.md
          retention-days: 14
