name: Publish verified macOS Apple Silicon preview
on:
  push:
    branches: [main]
    paths: ['staging/macos/5.0.3-arm64/PUBLISH']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trader-os-macos-arm64-release
  cancel-in-progress: false
jobs:
  macos-release:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Import exact merged source candidate and verify checksums
        run: python3 tools/import-macos-preview.py
      - name: Verify the distributed DMG and ZIP on Apple Silicon
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          MOUNT="$RUNNER_TEMP/trader-mac-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach macos-release/Trader-OS-5.0.3-mac-arm64.dmg -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          APP="$RUNNER_TEMP/Установка Trader OS/Trader OS.app"
          mkdir -p "$(dirname "$APP")"
          ditto "$MOUNT/Trader OS.app" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/Trader OS")" = arm64
          ditto -x -k macos-release/Trader-OS-5.0.3-mac-arm64.zip "$RUNNER_TEMP/zip-verify"
          codesign --verify --deep --strict "$RUNNER_TEMP/zip-verify/Trader OS.app"
          cmp "$APP/Contents/Resources/app.asar" "$RUNNER_TEMP/zip-verify/Trader OS.app/Contents/Resources/app.asar"
          cd macos-release
          python3 verify-macos.py "$APP/Contents/MacOS/Trader OS"
      - name: Upload draft by numeric ID, verify remote digests, then publish
        run: python3 tools/publish-macos-preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-release-verification
          path: |
            macos-release/*.log
            macos-release/*.png
            macos-release/*.json
            macos-release/*.md
            macos-release/SHA256SUMS.txt
          retention-days: 14
