name: Import OSMINOG Chrome 3.14.5 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-osminog-3145.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify 3.14.5 package
        shell: bash
        run: |
          set -euo pipefail
          url='https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-7954-820a-be9a-bab40711f44e/raw?se=2026-09-03T01%3A26%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=498e74db-a743-5bad-a07f-9d1d9ca857c3&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T22%3A25%3A41Z&ske=2026-09-03T22%3A25%3A41Z&sks=b&skv=2026-02-06&sig=KDVR7rEWrD3iM98z9DWqmhCeWeauAXT4pASlpOhg1wI%3D'
          curl -fL --retry 3 "$url" -o artifact.zip
          rm -rf unpacked && mkdir unpacked
          unzip -q artifact.zip -d unpacked
          inner=$(find unpacked -type f -name 'OSMINOG-Chrome-3.14.5-LEGACY-CHAT-POLISH.zip' | head -n 1)
          test -n "$inner"
          test "$(stat -c%s "$inner")" = '575061'
          test "$(sha256sum "$inner" | awk '{print $1}')" = '9f91a9f206251d5374eab06c4a714281de807a2c0a1036d5f359ac493b97a342'
          python - "$inner" <<'PY'
          import json,sys,zipfile,hashlib
          p=sys.argv[1]
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read('manifest.json'))
              assert m['name']=='OSMINOG'
              assert m['version']=='3.14.5' and m['version_name']=='3.14.5'
              assert hashlib.sha256(m['key'].encode()).hexdigest()=='1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e'
          PY
          dir='platforms/chrome-extension/releases/3.14.5'
          package='OSMINOG-Chrome-3.14.5-LEGACY-CHAT-POLISH.zip'
          mkdir -p "$dir"
          cp "$inner" "$dir/$package"
          cat > "$dir/release-v2.json" <<'JSON'
          {
            "schema":"osminog-release/v2",
            "product":"OSMINOG",
            "platform":"chrome-extension",
            "version":"3.14.5",
            "codename":"LEGACY CHAT POLISH",
            "baseVersion":"3.14.4",
            "package":"OSMINOG-Chrome-3.14.5-LEGACY-CHAT-POLISH.zip",
            "size":575061,
            "sha256":"9f91a9f206251d5374eab06c4a714281de807a2c0a1036d5f359ac493b97a342",
            "manifestVersion":"3.14.5",
            "fixedExtensionKeyRequired":true,
            "fixedIdentitySha256":"1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e",
            "minDevHubVersion":"2.0.0",
            "runtimeVerified":false,
            "notes":"Finishes legacy chat recovery by removing persisted OSMINOG telemetry cards from provider conversation history while preserving the 3.14.4 execution fixes."
          }
          JSON
          cat > "$dir/README.md" <<'MD'
          # OSMINOG Chrome 3.14.5 — LEGACY CHAT POLISH

          Follow-up to 3.14.4 using the proven older chat behavior as the reference.

          - saved OSMINOG progress/runtime telemetry cards are migrated out of provider conversation history on load;
          - only the selected provider remains a visible assistant speaker;
          - execution stages remain in the inline moving progress strip;
          - progress shows live elapsed seconds and “continues” while waiting;
          - reader-aware auto-scroll is preserved;
          - widget close/recreate, deterministic internet image placement, retry-loop stop, live version badge and interface text-size fixes from 3.14.4 remain intact.

          Package SHA-256: `9f91a9f206251d5374eab06c4a714281de807a2c0a1036d5f359ac493b97a342`
          Source commit: `4b73fbd32b9d80b765669335051c9b2eb912c4ac`
          MD
      - name: Archive package and metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platforms/chrome-extension/releases/3.14.5
          git commit -m 'Archive OSMINOG Chrome 3.14.5 package'
          git push origin HEAD:main
