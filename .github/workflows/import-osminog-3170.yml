name: Import OSMINOG Chrome 3.17.0 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-osminog-3170.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-bb20-81f4-9247-0ec1ac2c6779/raw?se=2026-09-03T08%3A37%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=f166b274-4099-579e-8d8a-ccd6d1d83a32&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-03T06%3A08%3A42Z&ske=2026-09-04T06%3A08%3A42Z&sks=b&skv=2026-02-06&sig=L5wcTf/iyHX4jRr6Ix/wCOuZUwJNE1u4qmNwZX3GczQ%3D'
      VERSION: '3.17.0'
      PACKAGE: 'OSMINOG-Chrome-3.17.0-GENERATIVE-APP-RUNTIME.zip'
      EXPECTED_SIZE: '577190'
      EXPECTED_SHA: '8b4ee419f6b1459c9a38936ff71609eb6f85111afd43f9e69e7a80d1a149923d'
      IDENTITY_SHA: '1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify CI artifact
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o /tmp/ci-artifact.zip
          mkdir -p /tmp/ci-artifact
          unzip -q /tmp/ci-artifact.zip -d /tmp/ci-artifact
          src="/tmp/ci-artifact/$PACKAGE"
          test -f "$src"
          test "$(stat -c '%s' "$src")" = "$EXPECTED_SIZE"
          test "$(sha256sum "$src" | awk '{print $1}')" = "$EXPECTED_SHA"
          python3 - "$src" "$VERSION" "$IDENTITY_SHA" <<'PY'
          import hashlib, json, sys, zipfile
          path, version, identity = sys.argv[1:]
          with zipfile.ZipFile(path) as z:
              names=z.namelist()
              assert 'manifest.json' in names
              m=json.loads(z.read('manifest.json'))
              assert m.get('version') == version
              assert m.get('version_name') == version
              assert m.get('name') == 'OSMINOG'
              assert m.get('key')
              assert hashlib.sha256(m['key'].encode()).hexdigest() == identity
              assert not any(n.startswith('/') or '..' in n.split('/') for n in names)
          print('verified immutable OSMINOG package')
          PY

      - name: Archive package and metadata
        shell: bash
        run: |
          set -euxo pipefail
          dir="platforms/chrome-extension/releases/$VERSION"
          mkdir -p "$dir"
          cp "/tmp/ci-artifact/$PACKAGE" "$dir/$PACKAGE"
          cat > "$dir/release-v2.json" <<JSON
          {
            "schema": "osminog-release/v2",
            "product": "OSMINOG",
            "platform": "chrome-extension",
            "version": "$VERSION",
            "codename": "GENERATIVE APP RUNTIME",
            "baseVersion": "3.16.0",
            "package": "$PACKAGE",
            "size": $EXPECTED_SIZE,
            "sha256": "$EXPECTED_SHA",
            "manifestVersion": "$VERSION",
            "fixedExtensionKeyRequired": true,
            "fixedIdentitySha256": "$IDENTITY_SHA",
            "minDevHubVersion": "2.0.0",
            "runtimeVerified": false,
            "notes": "Preset widgets removed. Any app or widget is generated from the current user request; OSMINOG provides verified install/update/rollback, app focus for follow-up edits, selected-file and capture APIs, proportional widget scaling and binary JS/WASM fetch support.",
            "publishedAt": null
          }
          JSON
          cat > "$dir/README.md" <<'MD'
          # OSMINOG Chrome 3.17.0 — GENERATIVE APP RUNTIME

          This release removes hard-coded stopwatch, calendar and player templates. Every app/widget is generated by the connected AI from the user's current request and preferences.

          OSMINOG owns the runtime: install, launch verification, transactional update/rollback, focus of an existing app for follow-up edits, selected canvas assets, screenshot/capture APIs, storage, browser/network access and binary JS/WASM fetch where permitted.

          Compact widgets auto-size to natural content. Manual resize scales the application proportionally rather than clipping an iframe inside an outer container. Visible controls are audited for interaction handlers before an app is accepted as ready.

          Emulator support is a capability, not a claim that every ROM/APK executes automatically. A compatible browser JS/WASM core is still required for the relevant format.

          Package: `OSMINOG-Chrome-3.17.0-GENERATIVE-APP-RUNTIME.zip`
          SHA-256: `8b4ee419f6b1459c9a38936ff71609eb6f85111afd43f9e69e7a80d1a149923d`
          Size: `577190` bytes
          Source commit: `1e646cff4d67788deea915aad61828b143de557a`
          MD
          rm -f .github/workflows/import-osminog-3170.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import OSMINOG Chrome 3.17.0 package'
          git push origin HEAD:main
