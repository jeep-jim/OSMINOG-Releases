name: Publish verified Mouse Browser 6.0.36 Windows x64
on:
  pull_request:
    paths: ['.gitattributes', 'tools/mouse636-*.py', 'tools/test_mouse636_*.py', '.github/workflows/publish-mouse636*.yml', 'staging/mouse/6.0.36-*/**']
  push:
    branches: [main]
    paths: ['staging/mouse/6.0.36-*/PUBLISH_OWNER', 'staging/mouse/6.0.36-*/pin.json', '.github/workflows/publish-mouse636-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    outputs:
      publish: ${{ steps.publish_plan.outputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify immutable reuse, current gates and all-platform publication
        run: python3 tools/test_mouse636_pipeline.py -v
      - name: Compile current publisher and independent validators
        run: python3 -m py_compile tools/mouse636-*.py
      - name: Validate the unready or exact pinned candidate contract
        run: python3 tools/mouse636-release.py validate-template
      - name: Require all three exact native candidates from the same merged source
        id: publish_plan
        run: python3 tools/mouse636-publish-plan.py windows-x64 >> "$GITHUB_OUTPUT"
  publish-windows:
    if: github.event_name != 'pull_request' && needs.contract.outputs.publish == 'true'
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 55
    permissions:
      contents: write
    concurrency:
      group: mouse-windows-x64-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve exact publisher source bytes on Windows
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import immutable successful Windows CI installer
        run: python tools/mouse636-windows-release.py import
      - name: Verify exact installer on a fresh Windows machine
        run: python tools/mouse636-windows-release.py verify
      - name: Publish and verify immutable public asset
        run: python tools/mouse636-windows-release.py publish
      - name: Advance Windows feed and verify anonymous discovery and download
        run: python tools/mouse636-windows-release.py channel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse636-windows-release-verification-${{ github.run_attempt }}
          path: |
            mouse636-windows-release/*.json
            mouse636-windows-release/*.log
            mouse636-windows-release/*.png
            mouse636-windows-release/mouse-631-upgrade/**
            mouse636-windows-release/mouse-636-baseline-performance/**
            mouse636-windows-release/SHA256SUMS.txt
            mouse636-windows-release/RELEASE_NOTES.md
          retention-days: 14
