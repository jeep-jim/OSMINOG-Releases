name: Import OSMINOG Chrome 3.19.7 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-osminog-3197.yml'

permissions:
  contents: write
  actions: write

env:
  VERSION: '3.19.7'
  PACKAGE: 'OSMINOG-Chrome-3.19.7-DOCKED-CORE-HERO.zip'
  BASE_URL: 'https://github.com/jeep-jim/OSMINOG-Releases/releases/download/chrome-v3.19.6/OSMINOG-Chrome-3.19.6-CINEMATIC-CORE-HERO.zip'
  HERO_SIZE: '1796453'
  HERO_SHA: '0f3bfa90a683f9efe4ca81f28889bd2b29543b7e52469815dd36a281c843214c'

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild 3.19.7 from verified public 3.19.6 base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          curl -fL --retry 3 -o /tmp/base.zip "$BASE_URL"
          unzip -q /tmp/base.zip -d /tmp/pkg
          test -f /tmp/pkg/assets/core/core-hero-3196.png
          test "$(stat -c%s /tmp/pkg/assets/core/core-hero-3196.png)" = "$HERO_SIZE"
          test "$(sha256sum /tmp/pkg/assets/core/core-hero-3196.png | awk '{print $1}')" = "$HERO_SHA"

          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/pkg')
          h=root/'editor.html'
          s=h.read_text(encoding='utf-8')
          spark_anchor='<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>'
          spark_symbol='<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2l1.6 5.1L19 9l-5.4 1.9L12 16l-1.6-5.1L5 9l5.4-1.9L12 2Z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z"/></symbol>'
          if 'id="i-spark"' not in s:
              assert spark_anchor in s
              s=s.replace(spark_anchor,spark_anchor+'\n    '+spark_symbol,1)
          old_actions='<div class="empty-launch-actions"><button data-create="file" class="primary-btn">Добавить файлы</button><button data-create="browser" class="soft-btn">Открыть браузер</button><button id="emptyConnectAi" class="soft-btn">Подключить ИИ</button></div>'
          new_actions='<div class="empty-launch-actions"><button data-create="file" class="primary-btn"><svg class="empty-action-icon"><use href="#i-plus"/></svg><span>Добавить файлы</span></button><button data-create="browser" class="soft-btn"><svg class="empty-action-icon"><use href="#i-folder"/></svg><span>Открыть браузер</span></button><button id="emptyConnectAi" class="soft-btn"><svg class="empty-action-icon"><use href="#i-spark"/></svg><span>Подключить ИИ</span></button></div>'
          assert old_actions in s
          s=s.replace(old_actions,new_actions,1)
          old_providers='<div class="empty-provider-row"><button data-provider-open="gpt"><img src="icons/providers/openai.svg">ChatGPT</button><button data-provider-open="claude"><img src="icons/providers/claude.svg">Claude</button><button data-provider-open="gemini"><img src="icons/providers/gemini.svg">Gemini</button><button data-provider-open="deepseek"><img src="icons/providers/deepseek.svg">DeepSeek</button></div>'
          new_providers='<div class="empty-provider-row"><button data-provider-open="gpt"><img src="icons/providers/openai.svg" alt="">ChatGPT</button><button data-provider-open="claude"><img src="icons/providers/claude.svg" alt="">Claude</button><button data-provider-open="gemini"><img src="icons/providers/gemini.svg" alt="">Gemini</button><button data-provider-open="deepseek"><img src="icons/providers/deepseek.svg" alt="">DeepSeek</button><button data-provider-open="grok"><span class="empty-provider-grok-mark" aria-hidden="true">X</span>Grok</button></div>'
          assert old_providers in s
          s=s.replace(old_providers,new_providers,1)
          h.write_text(s,encoding='utf-8')

          c=root/'editor.css'
          s=c.read_text(encoding='utf-8')
          marker='/* OSMINOG 3.19.6 · CINEMATIC CORE HERO */'
          assert marker in s
          s=s[:s.index(marker)].rstrip()+r'''

          /* OSMINOG 3.19.7 · DOCKED CORE HERO */
          .core-hero-launch{position:absolute!important;overflow:visible!important;isolation:isolate!important;width:min(680px,68vw)!important;max-width:680px!important;margin-top:174px!important;padding:38px 36px 28px!important;border:0!important;border-radius:28px!important;background:transparent!important;box-shadow:none!important;text-align:center!important}
          .core-hero-launch::before{content:"";position:absolute;z-index:0;left:50%;top:-390px;width:min(1240px,96vw);height:690px;transform:translateX(-50%);background:radial-gradient(ellipse at center,color-mix(in srgb,var(--accent) 15%,transparent) 0,transparent 68%);filter:blur(22px);pointer-events:none}
          .core-hero-launch::after{content:"";position:absolute;z-index:2;inset:0;border-radius:28px;border:1px solid color-mix(in srgb,var(--line) 92%,transparent);background:color-mix(in srgb,var(--surface) 96%,transparent);box-shadow:none!important;backdrop-filter:blur(18px) saturate(1.08);pointer-events:none}
          .core-hero-composite{position:absolute!important;left:50%!important;top:0!important;z-index:1!important;width:min(1180px,94vw)!important;height:auto!important;max-width:none!important;transform:translate(-50%,-50%)!important;object-fit:contain!important;image-rendering:auto!important;pointer-events:none!important;user-select:none!important;-webkit-user-drag:none!important;filter:none!important;animation:none!important;will-change:auto!important}
          .core-hero-composite-front{z-index:6!important;clip-path:inset(0 64% 0 0);filter:none!important}
          .core-hero-launch>:not(.core-hero-composite){position:relative;z-index:4}
          .core-hero-launch>.empty-hint-close{position:absolute!important;z-index:9!important;top:14px!important;right:14px!important;left:auto!important}
          .core-hero-launch .hint-orb{margin-bottom:14px!important}.core-hero-launch .empty-kicker{letter-spacing:.16em!important}.core-hero-launch h2{max-width:590px!important;margin:12px auto 10px!important;font-size:clamp(30px,3.25vw,44px)!important;line-height:1.04!important}.core-hero-launch p{max-width:600px!important;margin:0 auto 22px!important;font-size:13px!important;line-height:1.55!important}
          .core-hero-launch .empty-launch-actions{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:16px!important;width:100%!important;margin:0 auto 16px!important;align-items:stretch!important}.core-hero-launch .empty-launch-actions>button{height:54px!important;min-width:0!important;padding:0 18px!important;border-radius:16px!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:10px!important;font-size:14px!important;font-weight:760!important;white-space:nowrap!important;border:1px solid color-mix(in srgb,var(--line-strong) 86%,transparent)!important;background:color-mix(in srgb,var(--surface-2) 90%,transparent)!important;box-shadow:none!important}.core-hero-launch .empty-launch-actions>button:hover{background:var(--surface-3)!important;border-color:color-mix(in srgb,var(--accent) 30%,var(--line-strong))!important;transform:translateY(-1px)}.core-hero-launch .empty-launch-actions>.primary-btn{border-color:transparent!important;color:#fff!important;background:linear-gradient(120deg,#526fff 0%,#7657ff 100%)!important;box-shadow:none!important}
          .core-hero-launch .empty-action-icon{width:22px!important;height:22px!important;flex:0 0 22px!important;fill:none!important;stroke:currentColor!important;stroke-width:1.9!important;stroke-linecap:round!important;stroke-linejoin:round!important}.core-hero-launch .empty-launch-actions>.primary-btn .empty-action-icon{width:23px!important;height:23px!important;flex-basis:23px!important;padding:3px!important;border-radius:999px!important;background:rgba(255,255,255,.20)!important;stroke-width:2.2!important}
          .core-hero-launch .empty-provider-row{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:12px!important;width:100%!important;margin:0 auto!important}.core-hero-launch .empty-provider-row>button{height:44px!important;min-width:0!important;padding:0 12px!important;border:1px solid color-mix(in srgb,var(--line) 94%,transparent)!important;border-radius:15px!important;background:color-mix(in srgb,var(--surface-2) 90%,transparent)!important;color:var(--text)!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:9px!important;font-weight:720!important;font-size:13px!important;white-space:nowrap!important;box-shadow:none!important}.core-hero-launch .empty-provider-row>button:hover{background:var(--surface-3)!important;border-color:var(--line-strong)!important;transform:translateY(-1px)}.core-hero-launch .empty-provider-row img{width:25px!important;height:25px!important;flex:0 0 25px!important;object-fit:contain!important}.core-hero-launch .empty-provider-grok-mark{width:25px;height:25px;flex:0 0 25px;border-radius:7px;background:#fff;color:#0d1016;display:grid;place-items:center;font:900 17px/1 Arial,sans-serif;letter-spacing:-.08em}
          @media(max-width:1100px){.core-hero-launch{width:min(620px,72vw)!important;margin-top:150px!important;padding:34px 30px 26px!important}.core-hero-composite{width:min(1040px,96vw)!important;transform:translate(-50%,-49%)!important}.core-hero-composite-front{clip-path:inset(0 63% 0 0)}.core-hero-launch .empty-launch-actions{gap:12px!important}}
          @media(max-width:820px){.core-hero-launch{width:min(560px,82vw)!important;margin-top:122px!important;padding:30px 24px 24px!important}.core-hero-composite{width:min(850px,110vw)!important;transform:translate(-50%,-48%)!important}.core-hero-composite-front{clip-path:inset(0 62% 0 0)}.core-hero-launch .empty-launch-actions{grid-template-columns:1fr!important;gap:8px!important}.core-hero-launch .empty-launch-actions>button{height:46px!important;padding:0 15px!important}.core-hero-launch .empty-provider-row{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}}
          @media(max-height:760px) and (min-width:821px){.core-hero-launch{margin-top:120px!important;transform:translate(-50%,-43%)!important}.core-hero-composite{width:min(1040px,90vw)!important;transform:translate(-50%,-49%)!important}}
          '''+'\n'
          c.write_text(s,encoding='utf-8')

          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'));m['version']='3.19.7';m['version_name']='3.19.7';(root/'manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          b=json.loads((root/'OSMINOG_BUILD.json').read_text(encoding='utf-8'));b.update({'version':'3.19.7','versionName':'3.19.7','build':'3.19.7','codename':'DOCKED CORE HERO','baseVersion':'3.19.6','artifact':'OSMINOG-Chrome-3.19.7-DOCKED-CORE-HERO.zip','manifestVersion':'3.19.7','binaryInGitHub':True,'release':'DOCKED-CORE-HERO','notes':'Static docked cinematic startup hero lowered onto the launch card with no floating animation and no hero/card/button shadows; launch actions include icons; provider pills are evenly aligned and include Grok.'});(root/'OSMINOG_BUILD.json').write_text(json.dumps(b,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          test "$(python -c 'import json;print(json.load(open("/tmp/pkg/manifest.json"))["version"])')" = "$VERSION"
          grep -q 'OSMINOG 3.19.7 · DOCKED CORE HERO' /tmp/pkg/editor.css
          grep -q 'transform:translate(-50%,-50%)' /tmp/pkg/editor.css
          grep -q 'animation:none!important' /tmp/pkg/editor.css
          grep -q 'filter:none!important' /tmp/pkg/editor.css
          grep -q 'box-shadow:none!important' /tmp/pkg/editor.css
          grep -q 'empty-action-icon' /tmp/pkg/editor.html
          grep -q 'data-provider-open="grok"' /tmp/pkg/editor.html
          node --check /tmp/pkg/editor.js
          python -m json.tool /tmp/pkg/manifest.json >/dev/null
          (cd /tmp/pkg && zip -qr "$GITHUB_WORKSPACE/$PACKAGE" .)
          unzip -t "$PACKAGE" >/dev/null

      - name: Register immutable 3.19.7 package
        shell: bash
        run: |
          set -euo pipefail
          release_dir="platforms/chrome-extension/releases/$VERSION"
          mkdir -p "$release_dir"
          cp "$PACKAGE" "$release_dir/$PACKAGE"
          size=$(stat -c%s "$release_dir/$PACKAGE")
          sha=$(sha256sum "$release_dir/$PACKAGE" | awk '{print $1}')
          python - "$release_dir/release-v2.json" "$size" "$sha" <<'PY'
          import json,pathlib,sys
          out,size,sha=sys.argv[1:4]
          meta={'schema':'osminog-release/v2','product':'OSMINOG','platform':'chrome-extension','version':'3.19.7','codename':'DOCKED CORE HERO','baseVersion':'3.19.6','package':'OSMINOG-Chrome-3.19.7-DOCKED-CORE-HERO.zip','size':int(size),'sha256':sha,'manifestVersion':'3.19.7','fixedExtensionKeyRequired':True,'fixedIdentitySha256':'1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e','minDevHubVersion':'2.0.0','runtimeVerified':False,'notes':'Welcome art lowered onto the launch card; float animation and shadow filters removed to eliminate horizontal shadow bands; action buttons now have icons; provider pills are evenly spaced and include Grok.','publishedAt':None}
          pathlib.Path(out).write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cat > "$release_dir/README.md" <<'EOF'
          # OSMINOG Chrome 3.19.7 — Docked Core Hero

          - final 3.19.6 hero asset is reused byte-for-byte;
          - hero is lowered onto the card to remove the empty gap;
          - floating animation is removed;
          - hero/card/button shadows are removed to eliminate visible shadow bands;
          - action buttons include icons and match the approved compact reference;
          - provider row is five equal pills with Grok restored;
          - close button remains fixed at the top-right.
          EOF

      - name: Commit registry and cleanup importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-osminog-3197.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import OSMINOG Chrome 3.19.7 package [skip ci]'
          git push origin HEAD:main

      - name: Dispatch verified publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish-chrome-package-v2.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"
