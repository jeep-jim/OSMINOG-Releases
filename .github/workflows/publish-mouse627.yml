name: Publish verified Mouse Browser 6.0.27
on:
  pull_request:
    paths: ['tools/mouse627-release.py','tools/test-mouse627-release.py','.github/workflows/publish-mouse627.yml','staging/mouse/6.0.27-arm64/**']
  push:
    branches: [main]
    paths: ['staging/mouse/6.0.27-arm64/PUBLISH_OWNER']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/mouse627-release.py validate-template
      - run: python3 tools/test-mouse627-release.py
      - run: python3 tools/mouse627-release.py validate
  mouse-release:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: quadro-macos-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Import exact merged native-tested bytes
        run: python3 tools/mouse627-release.py import
      - name: Verify installed DMG, fixed Nora, desktop slides, window drag, documents and625-to-627 replacement
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cmp mouse627-release/Mouse-Browser-6.0.27-mac-arm64.dmg mouse627-release/Quadro-Browser-6.0.27-mac-arm64.dmg
          MOUNT="$RUNNER_TEMP/mouse627-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach mouse627-release/Mouse-Browser-6.0.27-mac-arm64.dmg -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          APP="$RUNNER_TEMP/Установка Mouse/Mouse Browser.app"
          mkdir -p "$(dirname "$APP")"
          ditto "$MOUNT/Mouse Browser.app" "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/Mouse Browser")" = arm64
          codesign --verify --deep --strict "$APP"
          ditto -x -k mouse627-release/Mouse-Browser-6.0.27-mac-arm64.zip "$RUNNER_TEMP/mouse627-zip"
          codesign --verify --deep --strict "$RUNNER_TEMP/mouse627-zip/Mouse Browser.app"
          cmp "$APP/Contents/Resources/app.asar" "$RUNNER_TEMP/mouse627-zip/Mouse Browser.app/Contents/Resources/app.asar"
          diff -qr "$APP/Contents/Resources/mouse-agent-node_modules" "$RUNNER_TEMP/mouse627-zip/Mouse Browser.app/Contents/Resources/mouse-agent-node_modules"
          test -x "$APP/Contents/Resources/mouse-agent-node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper"
          test -x "$RUNNER_TEMP/mouse627-zip/Mouse Browser.app/Contents/Resources/mouse-agent-node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper"
          hdiutil detach "$MOUNT"
          trap - EXIT
          cd mouse627-release
          env -u GH_TOKEN python3 mouse-verify.py "$APP/Contents/MacOS/Mouse Browser"
          grep -q MOUSE_627_REAL_625_TO_627_REPLACE_RELAUNCH_PROFILE_PASS mouse-update-roundtrip.log
          grep -q MOUSE_627_FIXED_PANEL_SLIDE_NATIVE_PASS mouse-smoke-write.log
          grep -q MOUSE_627_COMPOSITOR_DESKTOP_SLIDE_NATIVE_PASS mouse-smoke-write.log
          grep -q MOUSE_626_CAPTURE_ANY_COLOR_PASS mouse-smoke-write.log
          grep -q MOUSE_627_NATIVE_WINDOW_FOOTER_DRAG_PASS mouse-smoke-write.log
          grep -q MOUSE_627_DOCUMENT_TABS_NATIVE_PASS mouse-smoke-write.log
          grep -q MOUSE_627_PDF_EXISTING_TEXT_NATIVE_PASS mouse-smoke-write.log
          grep -q MOUSE_627_NATIVE_METADATA_WORKLOAD_PRESERVES_LIVE_PAGES_PASS mouse-smoke-write.log
          grep -q MOUSE_621_TOP_PLUS_BOTTOM_BURROW_BOTH_THEMES_PASS mouse-smoke-write.log
          grep -q MOUSE_621_DESKTOPS_TOASTS_ZOOM_EDITOR_PASS mouse-smoke-write.log
          grep -q MOUSE_621_NATIVE_CROSS_PAGE_PNG_DRAG_PASS mouse-smoke-write.log
          grep -q MOUSE_621_SMOOTH_DESKTOP_NATIVE_SLIDE_PASS mouse-smoke-write.log
          grep -q MOUSE_627_BURROW_FIXED_VIEWPORT_CONTROLS_PASS mouse-smoke-write.log
          grep -q MOUSE_623_TAB_LIFECYCLE_CHIPS_STABILITY_PASS mouse-smoke-write.log
          grep -q MOUSE_624_AGENT_SERVICE_LAYOUT_PERSIST_PASS mouse-smoke-write.log
          grep -q MOUSE_624_LAYOUT_UNDO_REDO_PERSIST_PASS mouse-smoke-write.log
          grep -q MOUSE_624_SCOPED_PROGRESS_PILL_PASS mouse-smoke-write.log
          grep -q MOUSE_625_DOCUMENTS_NATIVE_EDIT_SAVE_PRESERVE_PASS mouse-smoke-write.log
          grep -q MOUSE_625_SEARCH_ENGINE_NORMAL_PRIVATE_PASS mouse-smoke-write.log
          grep -q MOUSE_622_FIVE_DESKS_MODES_PRESERVE_TABS_PASS mouse-smoke-write.log
          grep -q MOUSE_622_BURROW_PREVIEW_BOTH_THEMES_PASS mouse-smoke-write.log
          grep -q MOUSE_622_AGENT_CDP_PTY_WORKER_STOP_PASS mouse-smoke-write.log
          grep -q MOUSE_620_REAL_HISTORY_NO_ACTION_FLOOD_PASS mouse-smoke-write.log
          grep -q MOUSE_620_UPDATE_HEAD_PREVIEW_ARCHIVE_CONTROLS_PASS mouse-smoke-write.log
          grep -q MOUSE_620_INSTALLED_ICNS_DOCK_UI_HEAD_PASS mouse-smoke-write.log
          grep -q MOUSE_619_NATIVE_CHARACTER_VIEWER_VISIBLE_PASS mouse-smoke-write.log
          grep -q MOUSE_619_EMOJI_FOOTER_PAGE_AI_SHELL_FOCUS_PASS mouse-smoke-write.log
          grep -q MOUSE_619_EMOJI_PRIVATE_FOCUS_AND_INSERTION_PASS mouse-mouse-private-smoke.log
          grep -q MOUSE_619_ACTIVE_TAB_FLOW_MATCHED_RIM_BOTH_THEMES_PASS mouse-smoke-write.log
          grep -q MOUSE_619_LIBRARY_ICONS_VIEWS_TOPBAR_SELECTION_SAFE_CLEAR_PASS mouse-smoke-write.log
          grep -q MOUSE_617_NATIVE_ADDRESS_CLICKS_HEAD_10PX_FOOTER_PASS mouse-smoke-write.log
          grep -q MOUSE_616_CONTROLS_LOADING_FULLSCREEN_CORNERS_NO_WALLET_PASS mouse-smoke-write.log
          grep -q MOUSE_PROFILE_COOKIE_RESTART_PASS mouse-smoke-read.log
      - name: Publish exact verified packages without overwriting prior releases
        run: python3 tools/mouse627-release.py publish
      - name: Advance existing static channel after verifying public packages
        run: python3 tools/mouse627-release.py channel
      - name: Verify actual shipped625 updater anonymous discovery and complete download
        shell: bash
        run: |
          env -u GH_TOKEN node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs/promises'),os=require('node:os');
          const {MouseUpdates:Old}=require('./mouse627-release/legacy625-update.cjs');
          const {MouseUpdates,CHANNEL}=require('./mouse627-release/mouse-update.cjs');
          const pin=require('./staging/mouse/6.0.27-arm64/pin.json');
          const diagnostics={version:'6.0.27',channel:CHANNEL,maxResponses:64,maxBodyBytes:8192,responses:[],attempts:[]},pendingDiagnostics=new Set();let stateCheckAttempt=null;
          const boundedPush=(rows,value)=>{rows.push(value);if(rows.length>64)rows.shift();return value;};
          const beginCheck=(stage,attempt)=>stateCheckAttempt=boundedPush(diagnostics.attempts,{stage,attempt,startedAt:new Date().toISOString()});
          const stateSummary=state=>Object.fromEntries(['phase','channel','currentVersion','latestVersion','availableVersion','error'].map(key=>[key,typeof state[key]==='string'?state[key].slice(0,2048):state[key]]));
          async function channelBodyPrefix(response,entry){
            const reader=response.body?.getReader(),chunks=[];let bytes=0;
            try{
              if(reader)while(bytes<8192){const {done,value}=await reader.read();if(done)break;const chunk=Buffer.from(value.subarray(0,8192-bytes));chunks.push(chunk);bytes+=chunk.length;}
            }catch(error){entry.bodyReadError=String(error.message).slice(0,2048);}
            finally{
              if(reader){void reader.cancel().catch(()=>{});reader.releaseLock();}
              entry.body=Buffer.concat(chunks).toString('utf8');entry.bodyBytes=bytes;entry.bodyLimitReached=bytes===8192;entry.bodyReadFinishedAt=new Date().toISOString();
            }
          }
          const fetcher=async(url,options)=>{
            const parsed=new URL(url);assert.notEqual(parsed.hostname,'api.github.com','Static channel must work without GitHub API');
            const started=Date.now(),entry=parsed.href===CHANNEL?boundedPush(diagnostics.responses,{url:parsed.href,startedAt:new Date(started).toISOString(),stateCheckAttempt:stateCheckAttempt?{stage:stateCheckAttempt.stage,attempt:stateCheckAttempt.attempt}:null}):null;
            try{
              const response=await fetch(url,options);
              if(entry){
                Object.assign(entry,{receivedAt:new Date().toISOString(),elapsedMs:Date.now()-started,status:response.status,responseURL:response.url,headers:Object.fromEntries(['Date','Age','Cache-Control','ETag'].map(name=>[name,response.headers.get(name)]))});
                try{const clone=response.clone(),task=channelBodyPrefix(clone,entry).catch(error=>{entry.bodyReadError=String(error.message).slice(0,2048);}).finally(()=>pendingDiagnostics.delete(task));pendingDiagnostics.add(task);}catch(error){entry.bodyReadError=String(error.message).slice(0,2048);}
              }
              return response;
            }catch(error){if(entry)Object.assign(entry,{finishedAt:new Date().toISOString(),elapsedMs:Date.now()-started,error:String(error.message).slice(0,2048)});throw error;}
          };
          async function saveDiagnostics(outcome){
            try{await Promise.allSettled([...pendingDiagnostics]);await fs.writeFile('mouse627-release/channel-discovery-diagnostics.json',JSON.stringify({...diagnostics,outcome,savedAt:new Date().toISOString()},null,2));}
            catch(error){console.error('MOUSE627_CHANNEL_DIAGNOSTICS_WRITE_FAILED',error.message);}
          }
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let u,error;
            for(let i=0;i<48;i++){
              const attempt=beginCheck('shipped625',i+1);
              try{u=new Old({app:{getVersion:()=> '6.0.25',getPath:()=>os.tmpdir()},shell:{},fetcher});const s=await u.run('check');attempt.state=stateSummary(s);attempt.finishedAt=new Date().toISOString();assert.equal(s.phase,'available');assert.equal(s.channel,'static');assert.equal(s.latestVersion,'6.0.27');assert.equal(s.availableVersion,'6.0.27');error=null;break;}catch(e){attempt.finishedAt??=new Date().toISOString();attempt.error=String(e.message).slice(0,2048);error=e;await sleep(5000)}
            }
            if(error){await saveDiagnostics('discovery-failed');throw error;}
            assert.equal(u.candidate.hash,pin.packages['Mouse-Browser-6.0.27-mac-arm64.dmg'].sha256);
            assert.equal((await u.run('download')).phase,'ready');await u.verified();
            const current=new MouseUpdates({app:{getVersion:()=> '6.0.27'},shell:{},fetcher});
            const currentAttempt=beginCheck('current627',1);
            try{assert.equal((await current.run('check')).phase,'current');assert.equal(current.state.channel,'static');assert.equal(current.state.availableVersion,'');}finally{currentAttempt.state=stateSummary(current.state);currentAttempt.finishedAt=new Date().toISOString();}
            await fs.writeFile('mouse627-release/channel-verification.json',JSON.stringify({channel:CHANNEL,actualOldModuleVersion:'6.0.25',version:'6.0.27',hash:u.candidate.hash,size:u.candidate.size,anonymousDiscovery:true,verifiedDownload:true,oldValidatedBadgeState:true,currentVersionCheck:true},null,2));
            await saveDiagnostics('success');
            console.log('MOUSE627_ACTUAL_625_UPDATER_STATIC_DISCOVERY_DOWNLOAD_PASS');
          })().catch(async e=>{await saveDiagnostics('failure');console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse627-release-verification
          path: |
            mouse627-release/*.log
            mouse627-release/*.png
            mouse627-release/*.json
            mouse627-release/*.md
            mouse627-release/SHA256SUMS.txt
          retention-days: 14
