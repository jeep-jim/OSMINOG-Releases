name: Publish verified Mouse Browser 6.0.10
on:
  push:
    branches: [main]
    paths: ['staging/mouse/6.0.10-arm64/PUBLISH']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quadro-macos-release
  cancel-in-progress: false
jobs:
  mouse-release:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import exact merged native-tested bytes
        run: python3 tools/mouse610-release.py import
      - name: Verify actual DMG, artwork, existing features and 609-to-610 replacement
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cmp mouse610-release/Mouse-Browser-6.0.10-mac-arm64.dmg mouse610-release/Quadro-Browser-6.0.10-mac-arm64.dmg
          MOUNT="$RUNNER_TEMP/mouse610-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach mouse610-release/Mouse-Browser-6.0.10-mac-arm64.dmg -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          APP="$RUNNER_TEMP/Установка Mouse/Mouse Browser.app"
          mkdir -p "$(dirname "$APP")"
          ditto "$MOUNT/Mouse Browser.app" "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/Mouse Browser")" = arm64
          codesign --verify --deep --strict "$APP"
          ditto -x -k mouse610-release/Mouse-Browser-6.0.10-mac-arm64.zip "$RUNNER_TEMP/mouse610-zip"
          codesign --verify --deep --strict "$RUNNER_TEMP/mouse610-zip/Mouse Browser.app"
          cmp "$APP/Contents/Resources/app.asar" "$RUNNER_TEMP/mouse610-zip/Mouse Browser.app/Contents/Resources/app.asar"
          hdiutil detach "$MOUNT"
          trap - EXIT
          cd mouse610-release
          env -u GH_TOKEN python3 quadro-verify.py "$APP/Contents/MacOS/Mouse Browser"
          grep -q MOUSE_610_REAL_609_TO_610_REPLACE_RELAUNCH_PROFILE_PASS mouse-update-roundtrip.log
          grep -q MOUSE_610_PURPLE_GLASSES_AND_ALL_FOOTER_PIXELS_BOTH_THEMES_PASS quadro-smoke-write.log
      - name: Publish immutable verified packages
        run: python3 tools/mouse610-release.py publish
      - name: Publish existing static updater channel after package verification
        run: python3 tools/mouse610-release.py channel
      - name: Verify shipped 609 updater discovery and full download
        shell: bash
        run: |
          env -u GH_TOKEN node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs/promises'),os=require('node:os');
          const {QuadroUpdates:Old}=require('./mouse610-release/legacy609-update.cjs');
          const {QuadroUpdates,CHANNEL}=require('./mouse610-release/quadro-update.cjs');
          const pin=require('./staging/mouse/6.0.10-arm64/pin.json');
          const fetcher=(url,options)=>{assert.notEqual(new URL(url).hostname,'api.github.com','static channel must work without API fallback');return fetch(url,options)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let u,error;
            for(let i=0;i<48;i++){
              try{u=new Old({app:{getVersion:()=> '6.0.9',getPath:()=>os.tmpdir()},shell:{},fetcher});const s=await u.run('check');assert.equal(s.phase,'available');assert.equal(s.channel,'static');assert.equal(s.latestVersion,'6.0.10');error=null;break;}catch(e){error=e;await sleep(5000)}
            }
            if(error)throw error;
            assert.equal(u.candidate.hash,pin.packages['Mouse-Browser-6.0.10-mac-arm64.dmg'].sha256);
            assert.equal((await u.run('download')).phase,'ready');await u.verified();
            const current=new QuadroUpdates({app:{getVersion:()=> '6.0.10'},shell:{},fetcher});
            assert.equal((await current.run('check')).phase,'current');assert.equal(current.state.channel,'static');
            await fs.writeFile('mouse610-release/channel-verification.json',JSON.stringify({channel:CHANNEL,actualOldModuleVersion:'6.0.9',version:'6.0.10',hash:u.candidate.hash,size:u.candidate.size,anonymousDiscovery:true,verifiedDownload:true,currentVersionCheck:true},null,2));
            console.log('MOUSE610_ACTUAL_609_UPDATER_STATIC_DISCOVERY_DOWNLOAD_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse610-release-verification
          path: |
            mouse610-release/*.log
            mouse610-release/*.png
            mouse610-release/*.json
            mouse610-release/*.md
            mouse610-release/SHA256SUMS.txt
          retention-days: 14
