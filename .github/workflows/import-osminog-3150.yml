name: Import OSMINOG Chrome 3.15.0 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-osminog-3150.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify 3.15.0 package
        shell: bash
        run: |
          set -euo pipefail
          url='https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-77c4-820a-a785-e6034bf6d515/raw?se=2026-09-03T02%3A29%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=3c7ac184-220e-54db-a86e-1ded9f4195e9&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T21%3A38%3A07Z&ske=2026-09-03T21%3A38%3A07Z&sks=b&skv=2026-02-06&sig=7HFmolCactlRvwUAduU9VWYtZkSDErTWS23a0G7d7nQ%3D'
          curl -fL --retry 3 "$url" -o artifact.zip
          rm -rf unpacked && mkdir unpacked
          unzip -q artifact.zip -d unpacked
          inner=$(find unpacked -type f -name 'OSMINOG-Chrome-3.15.0-INTERACTIVE-CAPABILITY-RUNTIME.zip' | head -n 1)
          test -n "$inner"
          test "$(stat -c%s "$inner")" = '580151'
          test "$(sha256sum "$inner" | awk '{print $1}')" = '9838c05ded643e4034cc9ce601e64819b94e94f98878a83f8a48f03283e20031'
          python - "$inner" <<'PY'
          import json,sys,zipfile,hashlib
          p=sys.argv[1]
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read('manifest.json'))
              assert m['name']=='OSMINOG'
              assert m['version']=='3.15.0' and m['version_name']=='3.15.0'
              assert hashlib.sha256(m['key'].encode()).hexdigest()=='1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e'
              for f in ['gpt-presence.js','bridge.js','osminog-module-runtime.js','osminog-graphics-studio.js','editor.js']:
                  assert f in z.namelist()
          PY
          dir='platforms/chrome-extension/releases/3.15.0'
          package='OSMINOG-Chrome-3.15.0-INTERACTIVE-CAPABILITY-RUNTIME.zip'
          mkdir -p "$dir"
          cp "$inner" "$dir/$package"
          cat > "$dir/release-v2.json" <<'JSON'
          {
            "schema":"osminog-release/v2",
            "product":"OSMINOG",
            "platform":"chrome-extension",
            "version":"3.15.0",
            "codename":"INTERACTIVE CAPABILITY RUNTIME",
            "baseVersion":"3.14.5",
            "package":"OSMINOG-Chrome-3.15.0-INTERACTIVE-CAPABILITY-RUNTIME.zip",
            "size":580151,
            "sha256":"9838c05ded643e4034cc9ce601e64819b94e94f98878a83f8a48f03283e20031",
            "manifestVersion":"3.15.0",
            "fixedExtensionKeyRequired":true,
            "fixedIdentitySha256":"1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e",
            "minDevHubVersion":"2.0.0",
            "runtimeVerified":false,
            "notes":"Host-owned repeated widget creation, fresh tool leases, owner-only Poseidon, native editable AI graphics runtime, file-aware sandbox apps and media/File Lab foundations."
          }
          JSON
          cat > "$dir/README.md" <<'MD'
          # OSMINOG Chrome 3.15.0 — INTERACTIVE CAPABILITY RUNTIME

          Product-runtime expansion after owner live testing of 3.14.5.

          - stopwatch, calendar and music-player requests use host-owned deterministic widget creation, so the connected AI cannot lose `module_create` after one successful app;
          - every provider request receives a fresh capability lease; generic apps use one contract: AI creates the UI/code, OSMINOG installs and verifies it;
          - the music-player widget can read a selected canvas audio asset through sandbox permission `assets.read`;
          - audio/video files play in the built-in workbench; spreadsheet, ROM and APK binaries are preserved as File Lab assets available to AI-built applications;
          - Graphics Studio exposes native editable `graphics_create` layers using the canvas vector/shape/text/image model, including Bézier paths, masks, gradients, opacity and stroke;
          - Poseidon/source/release capabilities are gated to verified write access to the private owner repository; normal users keep the interactive workspace without product-source authority.

          Boundary: Chrome does not execute Android APK files natively. Console ROM execution also requires a compatible emulator core; 3.15.0 provides the binary asset-to-sandbox-app foundation rather than pretending arbitrary binaries are executable.

          Package SHA-256: `9838c05ded643e4034cc9ce601e64819b94e94f98878a83f8a48f03283e20031`
          Package bytes: `580151`
          Source commit: `8e9e2278d8064df97bf5b795689d6b10fd3a2a89`
          MD
      - name: Archive package and metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platforms/chrome-extension/releases/3.15.0
          git commit -m 'Archive OSMINOG Chrome 3.15.0 package'
          git push origin HEAD:main
