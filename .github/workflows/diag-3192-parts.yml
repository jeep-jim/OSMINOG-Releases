name: Diagnose OSMINOG 3.19.2 staged parts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-3192-parts.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print normalized staged part hashes
        shell: bash
        run: |
          set -euo pipefail
          for f in staging/chrome-extension/3.19.2/source/part-*.b64; do
            printf '%s bytes=' "$f"
            tr -d '\r\n\t ' < "$f" | wc -c
            printf '%s sha=' "$f"
            tr -d '\r\n\t ' < "$f" | sha256sum | awk '{print $1}'
          done
          cat staging/chrome-extension/3.19.2/source/part-*.b64 | tr -d '\r\n\t ' | sha256sum
