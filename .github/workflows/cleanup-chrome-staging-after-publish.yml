name: Clean Chrome staging after successful publication

on:
  workflow_run:
    workflows: ['Publish OSMINOG Chrome package v2']
    types: [completed]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove published text-safe staging payloads
        shell: bash
        run: |
          set -euo pipefail
          feed='channels/dev/chrome-extension.json'
          test -f "$feed"
          version=$(jq -r '.latest.version' "$feed")
          staging="staging/chrome-extension/$version"
          if [ -d "$staging" ]; then
            rm -rf "$staging"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A "$staging"
            if ! git diff --cached --quiet; then
              git commit -m "Clean Chrome $version publication staging [skip ci]"
              git push origin HEAD:main
            fi
          fi
