name: Publish verified Mouse Browser 6.0.29
on:
  pull_request:
    paths: ['tools/mouse629-*.py','tools/test-mouse629-evidence.py','.github/workflows/publish-mouse629.yml','staging/mouse/6.0.29-arm64/**']
  push:
    branches: [main]
    paths: ['staging/mouse/6.0.29-arm64/PUBLISH_OWNER']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile tools/mouse629-release.py tools/mouse629-evidence.py tools/mouse628-motion-trace.py
      - run: python3 tools/mouse629-release.py validate-template
      - run: python3 tools/test-mouse629-evidence.py
      - if: github.event_name != 'pull_request'
        run: python3 tools/mouse629-release.py validate
  mouse-release:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: write
    concurrency:
      group: quadro-macos-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Import exact merged native-tested packages
        run: python3 tools/mouse629-release.py import
      - name: Verify installed DMG and actual previous-version replacement
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cmp mouse629-release/Mouse-Browser-6.0.29-mac-arm64.dmg mouse629-release/Quadro-Browser-6.0.29-mac-arm64.dmg
          MOUNT="$RUNNER_TEMP/mouse629-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach mouse629-release/Mouse-Browser-6.0.29-mac-arm64.dmg -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          APP="$RUNNER_TEMP/Установка Mouse/Mouse Browser.app"
          mkdir -p "$(dirname "$APP")"
          ditto "$MOUNT/Mouse Browser.app" "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/Mouse Browser")" = arm64
          codesign --verify --deep --strict "$APP"
          ditto -x -k mouse629-release/Mouse-Browser-6.0.29-mac-arm64.zip "$RUNNER_TEMP/mouse629-zip"
          codesign --verify --deep --strict "$RUNNER_TEMP/mouse629-zip/Mouse Browser.app"
          cmp "$APP/Contents/Resources/app.asar" "$RUNNER_TEMP/mouse629-zip/Mouse Browser.app/Contents/Resources/app.asar"
          diff -qr "$APP/Contents/Resources/mouse-agent-node_modules" "$RUNNER_TEMP/mouse629-zip/Mouse Browser.app/Contents/Resources/mouse-agent-node_modules"
          test -x "$APP/Contents/Resources/mouse-agent-node_modules/node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper"
          test -x "$RUNNER_TEMP/mouse629-zip/Mouse Browser.app/Contents/Resources/mouse-agent-node_modules/node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper"
          hdiutil detach "$MOUNT"
          trap - EXIT
          cd mouse629-release
          rm -f mouse-628-motion-trace.json mouse-628-motion.json mouse-628-motion-trace-report.json
          env -u GH_TOKEN python3 mouse-verify.py "$APP/Contents/MacOS/Mouse Browser"
          grep -q MOUSE_629_REAL_628_TO_629_REPLACE_RELAUNCH_PROFILE_PASS mouse-update-roundtrip.log
          grep -q MOUSE_628_PER_PANE_PROGRESS_NATIVE_PASS mouse-smoke-write.log
          grep -q MOUSE_628_LOCAL_MCP_NATIVE_PASS mouse-smoke-write.log
          grep -q MOUSE_628_OPEN_NORA_DESKTOP_SLIDE_NATIVE_PASS mouse-smoke-write.log
          grep -q MOUSE_628_BORDERLESS_NATIVE_PASS mouse-smoke-write.log
          grep -q MOUSE_628_NORA_CONTENT_FIT_NATIVE_PASS mouse-smoke-write.log
          grep -q MOUSE_629_UI_REGRESSIONS_NATIVE_PASS mouse-smoke-write.log
          grep -q MOUSE_629_TWO_FINGER_WHEEL_TUTORIAL_WRITE_PASS mouse-smoke-write.log
          grep -q MOUSE_629_TWO_FINGER_WHEEL_TUTORIAL_NATIVE_PASS mouse-smoke-read.log
          grep -q MOUSE_PROFILE_COOKIE_RESTART_PASS mouse-smoke-read.log
      - name: Recompute fresh installed evidence and publish exact packages
        run: python3 tools/mouse629-release.py publish
      - name: Advance static update channel after public package verification
        run: python3 tools/mouse629-release.py channel
      - name: Verify shipped 6.0.28 updater discovers and downloads 6.0.29 anonymously
        shell: bash
        run: |
          env -u GH_TOKEN node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs/promises'),os=require('node:os');
          const {MouseUpdates:Old}=require('./mouse629-release/legacy628-update.cjs');
          const {MouseUpdates,CHANNEL}=require('./mouse629-release/mouse-update.cjs');
          const pin=require('./staging/mouse/6.0.29-arm64/pin.json');
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          (async()=>{
            let old,error,observations=[];
            for(let i=0;i<48;i++){
              try{
                old=new Old({app:{getVersion:()=> '6.0.28',getPath:()=>os.tmpdir()},shell:{}});
                const state=await old.run('check');
                observations.push({attempt:i+1,phase:state.phase,channel:state.channel,availableVersion:state.availableVersion});
                assert.equal(state.phase,'available');assert.equal(state.channel,'static');assert.equal(state.availableVersion,'6.0.29');error=null;break;
              }catch(e){error=e;observations.push({attempt:i+1,error:String(e.message)});await sleep(5000)}
            }
            await fs.writeFile('mouse629-release/channel-discovery-diagnostics.json',JSON.stringify({channel:CHANNEL,observations},null,2));
            if(error)throw error;
            const candidate=pin.packages['Mouse-Browser-6.0.29-mac-arm64.dmg'];
            assert.equal(old.candidate.hash,candidate.sha256);assert.equal(old.candidate.size,candidate.size);
            assert.equal((await old.run('download')).phase,'ready');await old.verified();
            const current=new MouseUpdates({app:{getVersion:()=> '6.0.29'},shell:{}});
            assert.equal((await current.run('check')).phase,'current');assert.equal(current.state.channel,'static');
            await fs.writeFile('mouse629-release/channel-verification.json',JSON.stringify({channel:CHANNEL,actualOldModuleVersion:'6.0.28',version:'6.0.29',hash:old.candidate.hash,size:old.candidate.size,anonymousDiscovery:true,verifiedDownload:true,currentVersionCheck:true},null,2));
            console.log('MOUSE629_ACTUAL_628_UPDATER_STATIC_DISCOVERY_DOWNLOAD_PASS');
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse629-release-verification-attempt-${{ github.run_attempt }}
          path: |
            mouse629-release/*.log
            mouse629-release/*.png
            mouse629-release/*.json
            mouse629-release/*.md
            mouse629-release/SHA256SUMS.txt
          retention-days: 14
