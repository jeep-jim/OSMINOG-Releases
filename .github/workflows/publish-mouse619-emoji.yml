name: Publish verified Mouse Browser 6.0.19
on:
  push:
    branches: [main]
    paths: ['staging/mouse/6.0.19-arm64/PUBLISH_EMOJI']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quadro-macos-release
  cancel-in-progress: false
jobs:
  mouse-release:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import exact merged native-tested bytes
        run: python3 tools/mouse619-emoji-release.py import
      - name: Verify installed DMG, native emoji panel and618-to-619 profile-preserving replacement
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cmp mouse619-release/Mouse-Browser-6.0.19-mac-arm64.dmg mouse619-release/Quadro-Browser-6.0.19-mac-arm64.dmg
          MOUNT="$RUNNER_TEMP/mouse619-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach mouse619-release/Mouse-Browser-6.0.19-mac-arm64.dmg -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          APP="$RUNNER_TEMP/Установка Mouse/Mouse Browser.app"
          mkdir -p "$(dirname "$APP")"
          ditto "$MOUNT/Mouse Browser.app" "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/Mouse Browser")" = arm64
          codesign --verify --deep --strict "$APP"
          ditto -x -k mouse619-release/Mouse-Browser-6.0.19-mac-arm64.zip "$RUNNER_TEMP/mouse619-zip"
          codesign --verify --deep --strict "$RUNNER_TEMP/mouse619-zip/Mouse Browser.app"
          cmp "$APP/Contents/Resources/app.asar" "$RUNNER_TEMP/mouse619-zip/Mouse Browser.app/Contents/Resources/app.asar"
          hdiutil detach "$MOUNT"
          trap - EXIT
          cd mouse619-release
          env -u GH_TOKEN python3 mouse-verify.py "$APP/Contents/MacOS/Mouse Browser"
          grep -q MOUSE_619_REAL_618_TO_619_REPLACE_RELAUNCH_PROFILE_PASS mouse-update-roundtrip.log
          grep -q MOUSE_619_NATIVE_CHARACTER_VIEWER_VISIBLE_PASS mouse-smoke-write.log
          grep -q MOUSE_619_EMOJI_FOOTER_PAGE_AI_SHELL_FOCUS_PASS mouse-smoke-write.log
          grep -q MOUSE_619_EMOJI_PRIVATE_FOCUS_AND_INSERTION_PASS mouse-mouse-private-smoke.log
          grep -q MOUSE_618_BURROW_DOWN1_SHORTER3_BOTH_THEMES_PASS mouse-smoke-write.log
          grep -q MOUSE_617_NATIVE_ADDRESS_CLICKS_HEAD_10PX_FOOTER_PASS mouse-smoke-write.log
          grep -q MOUSE_616_ARCH_PLUS_AND_SEPARATE_FOOTER_BOTH_THEMES_PASS mouse-smoke-write.log
          grep -q MOUSE_616_CONTROLS_LOADING_FULLSCREEN_CORNERS_NO_WALLET_PASS mouse-smoke-write.log
          grep -q MOUSE_PROFILE_COOKIE_RESTART_PASS mouse-smoke-read.log
          grep -q MOUSE_614_AI_FULLSCREEN_RESTORE_NORMAL_PASS mouse-smoke-write.log
          grep -q MOUSE_614_AI_FULLSCREEN_RESTORE_PRIVATE_PASS mouse-mouse-private-smoke.log
          grep -q MOUSE_614_REAL_UPDATE_BADGE_BOTH_THEMES_AND_BURROW_CLICK_PASS mouse-smoke-write.log
          grep -q MOUSE_611_PRIVATE_THEME_ASSETS_AND_LIVE_SWITCH_PASS mouse-mouse-private-smoke.log
          grep -q MOUSE_612_AI_LOGOS_NAV_ACTIVE_AND_ADJACENT_PLUS_PASS mouse-smoke-write.log
          grep -q MOUSE_612_DESTROYED_GUESTS_DISPOSE_AND_SHELL_RECOVERY_PASS mouse-smoke-write.log
          grep -q MOUSE_613_TABS_SWAP_ADDRESS_AI_CHROME_PASS mouse-smoke-write.log
      - name: Publish exact verified packages without overwriting prior releases
        run: python3 tools/mouse619-emoji-release.py publish
      - name: Advance existing static channel after verifying public packages
        run: python3 tools/mouse619-emoji-release.py channel
      - name: Verify actual shipped618 updater anonymous discovery and complete download
        shell: bash
        run: |
          env -u GH_TOKEN node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs/promises'),os=require('node:os');
          const {MouseUpdates:Old}=require('./mouse619-release/legacy618-update.cjs');
          const {MouseUpdates,CHANNEL}=require('./mouse619-release/mouse-update.cjs');
          const pin=require('./staging/mouse/6.0.19-arm64/pin.json');
          const fetcher=(url,options)=>{assert.notEqual(new URL(url).hostname,'api.github.com','Static channel must work without GitHub API');return fetch(url,options)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let u,error;
            for(let i=0;i<48;i++){
              try{u=new Old({app:{getVersion:()=> '6.0.18',getPath:()=>os.tmpdir()},shell:{},fetcher});const s=await u.run('check');assert.equal(s.phase,'available');assert.equal(s.channel,'static');assert.equal(s.latestVersion,'6.0.19');assert.equal(s.availableVersion,'6.0.19');error=null;break;}catch(e){error=e;await sleep(5000)}
            }
            if(error)throw error;
            assert.equal(u.candidate.hash,pin.packages['Mouse-Browser-6.0.19-mac-arm64.dmg'].sha256);
            assert.equal((await u.run('download')).phase,'ready');await u.verified();
            const current=new MouseUpdates({app:{getVersion:()=> '6.0.19'},shell:{},fetcher});
            assert.equal((await current.run('check')).phase,'current');assert.equal(current.state.channel,'static');assert.equal(current.state.availableVersion,'');
            await fs.writeFile('mouse619-release/channel-verification.json',JSON.stringify({channel:CHANNEL,actualOldModuleVersion:'6.0.18',version:'6.0.19',hash:u.candidate.hash,size:u.candidate.size,anonymousDiscovery:true,verifiedDownload:true,oldValidatedBadgeState:true,currentVersionCheck:true},null,2));
            console.log('MOUSE619_ACTUAL_618_UPDATER_STATIC_DISCOVERY_DOWNLOAD_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse619-release-verification
          path: |
            mouse619-release/*.log
            mouse619-release/*.png
            mouse619-release/*.json
            mouse619-release/*.md
            mouse619-release/SHA256SUMS.txt
          retention-days: 14
