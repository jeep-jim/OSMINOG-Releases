name: Publish verified Light desktop previews
on:
  push:
    branches: [main]
    paths: ['staging/desktop-light/*/PUBLISH-READY']
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: osminog-light-desktop-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version || '5.0.0' }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: python3 tools/publish_light_desktop.py "$VERSION"
      - name: Commit verified download manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channels/desktop-light/dev.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified unsigned Light desktop $VERSION [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
