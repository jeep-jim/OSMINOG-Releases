name: Import OSMINOG Chrome 3.19.9 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-osminog-3199.yml'

permissions:
  contents: write
  actions: write

env:
  VERSION: '3.19.9'
  PACKAGE: 'OSMINOG-Chrome-3.19.9-LANG-CANVAS-PROVIDERS-FIX.zip'
  BASE_URL: 'https://github.com/jeep-jim/OSMINOG-Releases/releases/download/chrome-v3.19.8/OSMINOG-Chrome-3.19.8-SOLID-DOCKED-HERO.zip'
  HERO_SIZE: '1796453'
  HERO_SHA: '0f3bfa90a683f9efe4ca81f28889bd2b29543b7e52469815dd36a281c843214c'

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild 3.19.9 from verified public 3.19.8 base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          curl -fL --retry 3 -o /tmp/base.zip "$BASE_URL"
          unzip -q /tmp/base.zip -d /tmp/pkg
          python scripts/import_3199.py /tmp/pkg
          test "$(stat -c%s /tmp/pkg/assets/core/core-hero-3196.png)" = "$HERO_SIZE"
          test "$(sha256sum /tmp/pkg/assets/core/core-hero-3196.png | awk '{print $1}')" = "$HERO_SHA"
          grep -q 'dataset.providerOpen' /tmp/pkg/editor.js
          grep -q 'grok:"https://grok.com/"' /tmp/pkg/editor.js
          grep -q 'ru:\["Соберите проект","вместе с командой ИИ"\]' /tmp/pkg/editor.js
          grep -q 'OSMINOG 3.19.9 · LOCALIZED DOCKED HERO' /tmp/pkg/editor.css
          grep -q 'OSMINOG 3.19.9 · LIGHT HOVER + LIVE CANVAS COLORS' /tmp/pkg/osminog-product-core-recovery.css
          grep -q 'background-color:var(--board-bg)!important' /tmp/pkg/osminog-product-core-recovery.css
          node --check /tmp/pkg/editor.js
          python -m json.tool /tmp/pkg/manifest.json >/dev/null
          test "$(python -c 'import json;print(json.load(open("/tmp/pkg/manifest.json"))["version"])')" = "$VERSION"
          python - <<'PY'
          import hashlib,json
          m=json.load(open('/tmp/pkg/manifest.json',encoding='utf-8'))
          assert hashlib.sha256((m.get('key') or '').encode()).hexdigest() == '1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e'
          PY
          (cd /tmp/pkg && zip -qr "$GITHUB_WORKSPACE/$PACKAGE" .)
          unzip -t "$PACKAGE" >/dev/null

      - name: Register immutable 3.19.9 package
        shell: bash
        run: |
          set -euo pipefail
          release_dir="platforms/chrome-extension/releases/$VERSION"
          mkdir -p "$release_dir"
          cp "$PACKAGE" "$release_dir/$PACKAGE"
          size=$(stat -c%s "$release_dir/$PACKAGE")
          sha=$(sha256sum "$release_dir/$PACKAGE" | awk '{print $1}')
          python - "$release_dir/release-v2.json" "$size" "$sha" <<'PY'
          import json,pathlib,sys
          out,size,sha=sys.argv[1:4]
          meta={'schema':'osminog-release/v2','product':'OSMINOG','platform':'chrome-extension','version':'3.19.9','codename':'LANGUAGE CANVAS PROVIDERS FIX','baseVersion':'3.19.8','package':'OSMINOG-Chrome-3.19.9-LANG-CANVAS-PROVIDERS-FIX.zip','size':int(size),'sha256':sha,'manifestVersion':'3.19.9','fixedExtensionKeyRequired':True,'fixedIdentitySha256':'1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e','minDevHubVersion':'2.0.0','runtimeVerified':False,'notes':'Welcome title localization restored and raised; provider pills route separately to ChatGPT, Claude, Gemini, DeepSeek and Grok; Light hover contrast repaired; Light and Dark canvas background and grid color controls restored; hero PNG unchanged.','publishedAt':None}
          pathlib.Path(out).write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cat > "$release_dir/README.md" <<'EOF'
          # OSMINOG Chrome 3.19.9

          - translated two-line welcome title restored and moved slightly upward;
          - ChatGPT, Claude, Gemini, DeepSeek and Grok welcome pills route independently;
          - Light-theme hover labels and icons remain readable;
          - Light/Dark canvas background and grid colors work again;
          - original cinematic hero PNG is preserved byte-for-byte.
          EOF

      - name: Commit registry and cleanup importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-osminog-3199.yml scripts/import_3199.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import OSMINOG Chrome 3.19.9 package [skip ci]'
          git push origin HEAD:main

      - name: Dispatch verified publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish-chrome-package-v2.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"
