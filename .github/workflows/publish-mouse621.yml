name: Publish verified Mouse Browser 6.0.21
on:
  pull_request:
    paths: ['tools/mouse621-release.py','.github/workflows/publish-mouse621.yml','staging/mouse/6.0.21-arm64/**']
  push:
    branches: [main]
    paths: ['staging/mouse/6.0.21-arm64/PUBLISH_OWNER']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/mouse621-release.py validate
  mouse-release:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: quadro-macos-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Import exact merged native-tested bytes
        run: python3 tools/mouse621-release.py import
      - name: Verify installed DMG, live desktops, actual image drag, editor and620-to-621 replacement
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cmp mouse621-release/Mouse-Browser-6.0.21-mac-arm64.dmg mouse621-release/Quadro-Browser-6.0.21-mac-arm64.dmg
          MOUNT="$RUNNER_TEMP/mouse621-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach mouse621-release/Mouse-Browser-6.0.21-mac-arm64.dmg -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          APP="$RUNNER_TEMP/Установка Mouse/Mouse Browser.app"
          mkdir -p "$(dirname "$APP")"
          ditto "$MOUNT/Mouse Browser.app" "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/Mouse Browser")" = arm64
          codesign --verify --deep --strict "$APP"
          ditto -x -k mouse621-release/Mouse-Browser-6.0.21-mac-arm64.zip "$RUNNER_TEMP/mouse621-zip"
          codesign --verify --deep --strict "$RUNNER_TEMP/mouse621-zip/Mouse Browser.app"
          cmp "$APP/Contents/Resources/app.asar" "$RUNNER_TEMP/mouse621-zip/Mouse Browser.app/Contents/Resources/app.asar"
          hdiutil detach "$MOUNT"
          trap - EXIT
          cd mouse621-release
          env -u GH_TOKEN python3 mouse-verify.py "$APP/Contents/MacOS/Mouse Browser"
          grep -q MOUSE_621_REAL_620_TO_621_REPLACE_RELAUNCH_PROFILE_PASS mouse-update-roundtrip.log
          grep -q MOUSE_621_TOP_PLUS_BOTTOM_BURROW_BOTH_THEMES_PASS mouse-smoke-write.log
          grep -q MOUSE_621_DESKTOPS_TOASTS_ZOOM_EDITOR_PASS mouse-smoke-write.log
          grep -q MOUSE_621_NATIVE_CROSS_PAGE_PNG_DRAG_PASS mouse-smoke-write.log
          grep -q MOUSE_621_SMOOTH_DESKTOP_NATIVE_SLIDE_PASS mouse-smoke-write.log
          grep -q MOUSE_620_REAL_HISTORY_NO_ACTION_FLOOD_PASS mouse-smoke-write.log
          grep -q MOUSE_620_UPDATE_HEAD_PREVIEW_ARCHIVE_CONTROLS_PASS mouse-smoke-write.log
          grep -q MOUSE_620_INSTALLED_ICNS_DOCK_UI_HEAD_PASS mouse-smoke-write.log
          grep -q MOUSE_619_NATIVE_CHARACTER_VIEWER_VISIBLE_PASS mouse-smoke-write.log
          grep -q MOUSE_619_EMOJI_FOOTER_PAGE_AI_SHELL_FOCUS_PASS mouse-smoke-write.log
          grep -q MOUSE_619_EMOJI_PRIVATE_FOCUS_AND_INSERTION_PASS mouse-mouse-private-smoke.log
          grep -q MOUSE_619_ACTIVE_TAB_FLOW_MATCHED_RIM_BOTH_THEMES_PASS mouse-smoke-write.log
          grep -q MOUSE_619_LIBRARY_ICONS_VIEWS_TOPBAR_SELECTION_SAFE_CLEAR_PASS mouse-smoke-write.log
          grep -q MOUSE_617_NATIVE_ADDRESS_CLICKS_HEAD_10PX_FOOTER_PASS mouse-smoke-write.log
          grep -q MOUSE_616_CONTROLS_LOADING_FULLSCREEN_CORNERS_NO_WALLET_PASS mouse-smoke-write.log
          grep -q MOUSE_PROFILE_COOKIE_RESTART_PASS mouse-smoke-read.log
      - name: Publish exact verified packages without overwriting prior releases
        run: python3 tools/mouse621-release.py publish
      - name: Advance existing static channel after verifying public packages
        run: python3 tools/mouse621-release.py channel
      - name: Verify actual shipped620 updater anonymous discovery and complete download
        shell: bash
        run: |
          env -u GH_TOKEN node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs/promises'),os=require('node:os');
          const {MouseUpdates:Old}=require('./mouse621-release/legacy620-update.cjs');
          const {MouseUpdates,CHANNEL}=require('./mouse621-release/mouse-update.cjs');
          const pin=require('./staging/mouse/6.0.21-arm64/pin.json');
          const fetcher=(url,options)=>{assert.notEqual(new URL(url).hostname,'api.github.com','Static channel must work without GitHub API');return fetch(url,options)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let u,error;
            for(let i=0;i<48;i++){
              try{u=new Old({app:{getVersion:()=> '6.0.20',getPath:()=>os.tmpdir()},shell:{},fetcher});const s=await u.run('check');assert.equal(s.phase,'available');assert.equal(s.channel,'static');assert.equal(s.latestVersion,'6.0.21');assert.equal(s.availableVersion,'6.0.21');error=null;break;}catch(e){error=e;await sleep(5000)}
            }
            if(error)throw error;
            assert.equal(u.candidate.hash,pin.packages['Mouse-Browser-6.0.21-mac-arm64.dmg'].sha256);
            assert.equal((await u.run('download')).phase,'ready');await u.verified();
            const current=new MouseUpdates({app:{getVersion:()=> '6.0.21'},shell:{},fetcher});
            assert.equal((await current.run('check')).phase,'current');assert.equal(current.state.channel,'static');assert.equal(current.state.availableVersion,'');
            await fs.writeFile('mouse621-release/channel-verification.json',JSON.stringify({channel:CHANNEL,actualOldModuleVersion:'6.0.20',version:'6.0.21',hash:u.candidate.hash,size:u.candidate.size,anonymousDiscovery:true,verifiedDownload:true,oldValidatedBadgeState:true,currentVersionCheck:true},null,2));
            console.log('MOUSE621_ACTUAL_620_UPDATER_STATIC_DISCOVERY_DOWNLOAD_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse621-release-verification
          path: |
            mouse621-release/*.log
            mouse621-release/*.png
            mouse621-release/*.json
            mouse621-release/*.md
            mouse621-release/SHA256SUMS.txt
          retention-days: 14
