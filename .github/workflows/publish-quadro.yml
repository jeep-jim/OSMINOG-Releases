name: Publish verified Mouse Browser for Mac
on:
  push:
    branches: [main]
    paths: ['staging/quadro/6.0.6-arm64/PUBLISH']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quadro-macos-release
  cancel-in-progress: false
jobs:
  quadro-release:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Import exact successful merged Mouse source
        run: python3 tools/import-mouse606.py
      - name: Install actual Mouse DMG and repeat native runtime tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cmp mouse-release/Mouse-Browser-6.0.6-mac-arm64.dmg mouse-release/Quadro-Browser-6.0.6-mac-arm64.dmg
          MOUNT="$RUNNER_TEMP/mouse-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach mouse-release/Mouse-Browser-6.0.6-mac-arm64.dmg -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          APP="$RUNNER_TEMP/Установка Mouse/Mouse Browser.app"
          mkdir -p "$(dirname "$APP")"
          ditto "$MOUNT/Mouse Browser.app" "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/Mouse Browser")" = arm64
          codesign --verify --deep --strict "$APP"
          ditto -x -k mouse-release/Mouse-Browser-6.0.6-mac-arm64.zip "$RUNNER_TEMP/mouse-zip"
          codesign --verify --deep --strict "$RUNNER_TEMP/mouse-zip/Mouse Browser.app"
          cmp "$APP/Contents/Resources/app.asar" "$RUNNER_TEMP/mouse-zip/Mouse Browser.app/Contents/Resources/app.asar"
          cd mouse-release
          env -u GH_TOKEN python3 quadro-verify.py "$APP/Contents/MacOS/Mouse Browser"
      - name: Publish after remote SHA256 and legacy alias verification
        run: python3 tools/publish-mouse606.py
      - name: Verify actual old 6.0.5 updater and Mouse updater discover identical 6.0.6
        run: |
          env -u GH_TOKEN node - <<'NODE'
          const assert=require('node:assert/strict');
          async function check(file,prefix){const {QuadroUpdates}=require(file),u=new QuadroUpdates({app:{getVersion:()=> '6.0.5'},shell:{},emit:()=>{}});const r=await u.run('check');assert.equal(r.phase,'available');assert.equal(r.latestVersion,'6.0.6');assert.ok(u.candidate.name.startsWith(prefix));return u.candidate;}
          Promise.all([check('./mouse-release/legacy-update.cjs','Quadro-'),check('./mouse-release/quadro-update.cjs','Mouse-')]).then(([old,next])=>{assert.equal(old.hash,next.hash);assert.equal(old.size,next.size);console.log('QUADRO_605_AND_MOUSE_DISCOVER_IDENTICAL_606_PASS')}).catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse-release-verification
          path: |
            mouse-release/*.log
            mouse-release/*.png
            mouse-release/*.json
            mouse-release/*.md
            mouse-release/SHA256SUMS.txt
          retention-days: 14
