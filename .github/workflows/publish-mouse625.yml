name: Publish verified Mouse Browser 6.0.25
on:
  pull_request:
    paths: ['tools/mouse625-release.py','.github/workflows/publish-mouse625.yml','staging/mouse/6.0.25-arm64/**']
  push:
    branches: [main]
    paths: ['staging/mouse/6.0.25-arm64/PUBLISH_OWNER']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/mouse625-release.py validate
  mouse-release:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: quadro-macos-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Import exact merged native-tested bytes
        run: python3 tools/mouse625-release.py import
      - name: Verify installed DMG, documents, search, retained controls and623-to-625 replacement
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cmp mouse625-release/Mouse-Browser-6.0.25-mac-arm64.dmg mouse625-release/Quadro-Browser-6.0.25-mac-arm64.dmg
          MOUNT="$RUNNER_TEMP/mouse625-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach mouse625-release/Mouse-Browser-6.0.25-mac-arm64.dmg -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          APP="$RUNNER_TEMP/Установка Mouse/Mouse Browser.app"
          mkdir -p "$(dirname "$APP")"
          ditto "$MOUNT/Mouse Browser.app" "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/Mouse Browser")" = arm64
          codesign --verify --deep --strict "$APP"
          ditto -x -k mouse625-release/Mouse-Browser-6.0.25-mac-arm64.zip "$RUNNER_TEMP/mouse625-zip"
          codesign --verify --deep --strict "$RUNNER_TEMP/mouse625-zip/Mouse Browser.app"
          cmp "$APP/Contents/Resources/app.asar" "$RUNNER_TEMP/mouse625-zip/Mouse Browser.app/Contents/Resources/app.asar"
          diff -qr "$APP/Contents/Resources/mouse-agent-node_modules" "$RUNNER_TEMP/mouse625-zip/Mouse Browser.app/Contents/Resources/mouse-agent-node_modules"
          test -x "$APP/Contents/Resources/mouse-agent-node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper"
          test -x "$RUNNER_TEMP/mouse625-zip/Mouse Browser.app/Contents/Resources/mouse-agent-node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper"
          hdiutil detach "$MOUNT"
          trap - EXIT
          cd mouse625-release
          env -u GH_TOKEN python3 mouse-verify.py "$APP/Contents/MacOS/Mouse Browser"
          grep -q MOUSE_625_REAL_623_TO_625_REPLACE_RELAUNCH_PROFILE_PASS mouse-update-roundtrip.log
          grep -q MOUSE_621_TOP_PLUS_BOTTOM_BURROW_BOTH_THEMES_PASS mouse-smoke-write.log
          grep -q MOUSE_621_DESKTOPS_TOASTS_ZOOM_EDITOR_PASS mouse-smoke-write.log
          grep -q MOUSE_621_NATIVE_CROSS_PAGE_PNG_DRAG_PASS mouse-smoke-write.log
          grep -q MOUSE_621_SMOOTH_DESKTOP_NATIVE_SLIDE_PASS mouse-smoke-write.log
          grep -q MOUSE_623_BURROW_GEOMETRY_AND_SEAM_PASS mouse-smoke-write.log
          grep -q MOUSE_623_TAB_LIFECYCLE_CHIPS_STABILITY_PASS mouse-smoke-write.log
          grep -q MOUSE_624_AGENT_SERVICE_LAYOUT_PERSIST_PASS mouse-smoke-write.log
          grep -q MOUSE_624_LAYOUT_UNDO_REDO_PERSIST_PASS mouse-smoke-write.log
          grep -q MOUSE_624_SCOPED_PROGRESS_PILL_PASS mouse-smoke-write.log
          grep -q MOUSE_625_DOCUMENTS_NATIVE_EDIT_SAVE_PRESERVE_PASS mouse-smoke-write.log
          grep -q MOUSE_625_SEARCH_ENGINE_NORMAL_PRIVATE_PASS mouse-smoke-write.log
          grep -q MOUSE_622_FIVE_DESKS_MODES_PRESERVE_TABS_PASS mouse-smoke-write.log
          grep -q MOUSE_622_BURROW_PREVIEW_BOTH_THEMES_PASS mouse-smoke-write.log
          grep -q MOUSE_622_AGENT_CDP_PTY_WORKER_STOP_PASS mouse-smoke-write.log
          grep -q MOUSE_620_REAL_HISTORY_NO_ACTION_FLOOD_PASS mouse-smoke-write.log
          grep -q MOUSE_620_UPDATE_HEAD_PREVIEW_ARCHIVE_CONTROLS_PASS mouse-smoke-write.log
          grep -q MOUSE_620_INSTALLED_ICNS_DOCK_UI_HEAD_PASS mouse-smoke-write.log
          grep -q MOUSE_619_NATIVE_CHARACTER_VIEWER_VISIBLE_PASS mouse-smoke-write.log
          grep -q MOUSE_619_EMOJI_FOOTER_PAGE_AI_SHELL_FOCUS_PASS mouse-smoke-write.log
          grep -q MOUSE_619_EMOJI_PRIVATE_FOCUS_AND_INSERTION_PASS mouse-mouse-private-smoke.log
          grep -q MOUSE_619_ACTIVE_TAB_FLOW_MATCHED_RIM_BOTH_THEMES_PASS mouse-smoke-write.log
          grep -q MOUSE_619_LIBRARY_ICONS_VIEWS_TOPBAR_SELECTION_SAFE_CLEAR_PASS mouse-smoke-write.log
          grep -q MOUSE_617_NATIVE_ADDRESS_CLICKS_HEAD_10PX_FOOTER_PASS mouse-smoke-write.log
          grep -q MOUSE_616_CONTROLS_LOADING_FULLSCREEN_CORNERS_NO_WALLET_PASS mouse-smoke-write.log
          grep -q MOUSE_PROFILE_COOKIE_RESTART_PASS mouse-smoke-read.log
      - name: Publish exact verified packages without overwriting prior releases
        run: python3 tools/mouse625-release.py publish
      - name: Advance existing static channel after verifying public packages
        run: python3 tools/mouse625-release.py channel
      - name: Verify actual shipped623 updater anonymous discovery and complete download
        shell: bash
        run: |
          env -u GH_TOKEN node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs/promises'),os=require('node:os');
          const {MouseUpdates:Old}=require('./mouse625-release/legacy623-update.cjs');
          const {MouseUpdates,CHANNEL}=require('./mouse625-release/mouse-update.cjs');
          const pin=require('./staging/mouse/6.0.25-arm64/pin.json');
          const fetcher=(url,options)=>{assert.notEqual(new URL(url).hostname,'api.github.com','Static channel must work without GitHub API');return fetch(url,options)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let u,error;
            for(let i=0;i<48;i++){
              try{u=new Old({app:{getVersion:()=> '6.0.23',getPath:()=>os.tmpdir()},shell:{},fetcher});const s=await u.run('check');assert.equal(s.phase,'available');assert.equal(s.channel,'static');assert.equal(s.latestVersion,'6.0.25');assert.equal(s.availableVersion,'6.0.25');error=null;break;}catch(e){error=e;await sleep(5000)}
            }
            if(error)throw error;
            assert.equal(u.candidate.hash,pin.packages['Mouse-Browser-6.0.25-mac-arm64.dmg'].sha256);
            assert.equal((await u.run('download')).phase,'ready');await u.verified();
            const current=new MouseUpdates({app:{getVersion:()=> '6.0.25'},shell:{},fetcher});
            assert.equal((await current.run('check')).phase,'current');assert.equal(current.state.channel,'static');assert.equal(current.state.availableVersion,'');
            await fs.writeFile('mouse625-release/channel-verification.json',JSON.stringify({channel:CHANNEL,actualOldModuleVersion:'6.0.23',version:'6.0.25',hash:u.candidate.hash,size:u.candidate.size,anonymousDiscovery:true,verifiedDownload:true,oldValidatedBadgeState:true,currentVersionCheck:true},null,2));
            console.log('MOUSE625_ACTUAL_623_UPDATER_STATIC_DISCOVERY_DOWNLOAD_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse625-release-verification
          path: |
            mouse625-release/*.log
            mouse625-release/*.png
            mouse625-release/*.json
            mouse625-release/*.md
            mouse625-release/SHA256SUMS.txt
          retention-days: 14
