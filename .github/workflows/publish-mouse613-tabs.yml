name: Publish verified Mouse Browser 6.0.13 tabs and address
on:
  push:
    branches: [main]
    paths: ['staging/mouse/6.0.13-arm64/PUBLISH_TABS']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quadro-macos-release
  cancel-in-progress: false
jobs:
  mouse-release:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import exact merged native-tested bytes
        run: python3 tools/mouse613-tabs-release.py import
      - name: Verify installed DMG, tabs, address, AI and 612-to-613 replacement
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cmp mouse613-release/Mouse-Browser-6.0.13-mac-arm64.dmg mouse613-release/Quadro-Browser-6.0.13-mac-arm64.dmg
          MOUNT="$RUNNER_TEMP/mouse613-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach mouse613-release/Mouse-Browser-6.0.13-mac-arm64.dmg -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          APP="$RUNNER_TEMP/Установка Mouse/Mouse Browser.app"
          mkdir -p "$(dirname "$APP")"
          ditto "$MOUNT/Mouse Browser.app" "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/Mouse Browser")" = arm64
          codesign --verify --deep --strict "$APP"
          ditto -x -k mouse613-release/Mouse-Browser-6.0.13-mac-arm64.zip "$RUNNER_TEMP/mouse613-zip"
          codesign --verify --deep --strict "$RUNNER_TEMP/mouse613-zip/Mouse Browser.app"
          cmp "$APP/Contents/Resources/app.asar" "$RUNNER_TEMP/mouse613-zip/Mouse Browser.app/Contents/Resources/app.asar"
          hdiutil detach "$MOUNT"
          trap - EXIT
          cd mouse613-release
          env -u GH_TOKEN python3 quadro-verify.py "$APP/Contents/MacOS/Mouse Browser"
          grep -q MOUSE_613_REAL_612_TO_613_REPLACE_RELAUNCH_PROFILE_PASS mouse-update-roundtrip.log
          grep -q MOUSE_611_PRIVATE_THEME_ASSETS_AND_LIVE_SWITCH_PASS quadro-mouse-private-smoke.log
          grep -q MOUSE_612_AI_LOGOS_NAV_ACTIVE_AND_ADJACENT_PLUS_PASS quadro-smoke-write.log
          grep -q MOUSE_612_DESTROYED_GUESTS_DISPOSE_AND_SHELL_RECOVERY_PASS quadro-smoke-write.log
          grep -q MOUSE_613_TABS_SWAP_ADDRESS_AI_CHROME_PASS quadro-smoke-write.log
      - name: Publish immutable verified packages
        run: python3 tools/mouse613-tabs-release.py publish
      - name: Publish existing static channel after verifying public packages
        run: python3 tools/mouse613-tabs-release.py channel
      - name: Verify shipped 612 updater discovery and complete download
        shell: bash
        run: |
          env -u GH_TOKEN node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs/promises'),os=require('node:os');
          const {QuadroUpdates:Old}=require('./mouse613-release/legacy612-update.cjs');
          const {QuadroUpdates,CHANNEL}=require('./mouse613-release/quadro-update.cjs');
          const pin=require('./staging/mouse/6.0.13-arm64/pin.json');
          const fetcher=(url,options)=>{assert.notEqual(new URL(url).hostname,'api.github.com','Static channel must work without GitHub API');return fetch(url,options)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let u,error;
            for(let i=0;i<48;i++){
              try{u=new Old({app:{getVersion:()=> '6.0.12',getPath:()=>os.tmpdir()},shell:{},fetcher});const s=await u.run('check');assert.equal(s.phase,'available');assert.equal(s.channel,'static');assert.equal(s.latestVersion,'6.0.13');error=null;break;}catch(e){error=e;await sleep(5000)}
            }
            if(error)throw error;
            assert.equal(u.candidate.hash,pin.packages['Mouse-Browser-6.0.13-mac-arm64.dmg'].sha256);
            assert.equal((await u.run('download')).phase,'ready');await u.verified();
            const current=new QuadroUpdates({app:{getVersion:()=> '6.0.13'},shell:{},fetcher});
            assert.equal((await current.run('check')).phase,'current');assert.equal(current.state.channel,'static');
            await fs.writeFile('mouse613-release/channel-verification.json',JSON.stringify({channel:CHANNEL,actualOldModuleVersion:'6.0.12',version:'6.0.13',hash:u.candidate.hash,size:u.candidate.size,anonymousDiscovery:true,verifiedDownload:true,currentVersionCheck:true},null,2));
            console.log('MOUSE613_ACTUAL_612_UPDATER_STATIC_DISCOVERY_DOWNLOAD_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse613-release-verification
          path: |
            mouse613-release/*.log
            mouse613-release/*.png
            mouse613-release/*.json
            mouse613-release/*.md
            mouse613-release/SHA256SUMS.txt
          retention-days: 14
