name: Publish OSMINOG Chrome package v2

on:
  push:
    branches: [main]
    paths:
      - 'staging/chrome-extension/**/ACTIVATE-V2'
  workflow_dispatch:
    inputs:
      version:
        description: Chrome extension version to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: osminog-chrome-registry-v2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release registry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Verify import and recovery contracts
        run: python3 -m unittest discover -s tests -p 'test_chrome_import_contract.py'

      - name: Resolve release and verify immutable package
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.version || '' }}" ]; then
            version='${{ inputs.version || '' }}'
          else
            marker=$(find staging/chrome-extension -mindepth 2 -maxdepth 2 -type f -name ACTIVATE-V2 | sort -V | tail -n 1)
            test -n "$marker"
            version=$(basename "$(dirname "$marker")")
          fi

          release_dir="platforms/chrome-extension/releases/$version"
          meta="$release_dir/release-v2.json"
          test -f "$meta"

          package=$(jq -r '.package' "$meta")
          expected_size=$(jq -r '.size' "$meta")
          expected_sha=$(jq -r '.sha256' "$meta")
          expected_manifest=$(jq -r '.manifestVersion' "$meta")
          min_devhub=$(jq -r '.minDevHubVersion' "$meta")
          package_path="$release_dir/$package"

          # Text-safe bootstrap is a recovery fallback only. The canonical result is
          # always the complete immutable ZIP stored under the versioned release path.
          if [ ! -f "$package_path" ]; then
            parts_dir="staging/chrome-extension/$version/parts"
            test -d "$parts_dir"
            count=$(find "$parts_dir" -maxdepth 1 -type f -name 'part-*.b64' | wc -l | tr -d ' ')
            test "$count" -gt 0
            tmp=$(mktemp)
            find "$parts_dir" -maxdepth 1 -type f -name 'part-*.b64' -print0 \
              | sort -z -V \
              | xargs -0 cat \
              | tr -d '\r\n\t ' > "$tmp"
            mkdir -p "$release_dir"
            base64 --decode "$tmp" > "$package_path"
            rm -f "$tmp"
          fi

          actual_size=$(stat -c%s "$package_path")
          actual_sha=$(sha256sum "$package_path" | awk '{print $1}')
          test "$actual_size" = "$expected_size"
          test "$actual_sha" = "$expected_sha"

          python - "$package_path" "$expected_manifest" "$meta" <<'PY'
          import json, os, pathlib, sys, zipfile
          sys.path.insert(0, 'tools')
          from import_verified_chrome_ci import minimum_updater, validate_build, validate_recovery_page, version_tuple, SAFE_UPDATER_RELEASE
          path, expected, meta_path = sys.argv[1:4]
          meta = json.loads(pathlib.Path(meta_path).read_text(encoding='utf-8'))
          min_updater = minimum_updater(meta, expected)
          recovery_outputs = {}
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              if 'manifest.json' not in names:
                  raise SystemExit('root manifest.json missing')
              manifest = json.loads(z.read('manifest.json'))
              if manifest.get('version') != expected:
                  raise SystemExit(f"manifest version {manifest.get('version')} != {expected}")
              if manifest.get('name') != 'OSMINOG':
                  raise SystemExit('manifest product name is not OSMINOG')
              if not manifest.get('key'):
                  raise SystemExit('fixed Chrome extension key is missing')
              if any(name.startswith('/') or '..' in name.split('/') for name in names):
                  raise SystemExit('unsafe ZIP path detected')
              if version_tuple(expected) >= SAFE_UPDATER_RELEASE:
                  validate_build(json.loads(z.read('OSMINOG_BUILD.json')), expected, pathlib.Path(path).name)
                  if meta.get('runtimeVerified') is not False or meta.get('ciVerified') is not True:
                      raise SystemExit('release metadata confuses CI with owner runtime verification')
              if meta.get('recovery'):
                  recovery = meta['recovery']
                  # Validate the requested filename before using it as a path.
                  from import_verified_chrome_ci import validate_recovery_request
                  validate_recovery_request(recovery)
                  recovery_path = pathlib.Path(meta_path).parent/recovery['filename']
                  validate_recovery_page(recovery_path.read_bytes(), recovery, expected, manifest,
                      {'osminog-folder-updater.js': z.read('osminog-folder-updater.js')})
                  recovery_outputs = {'recovery_filename': recovery['filename'], 'recovery_path': str(recovery_path),
                      'recovery_size': str(recovery['size']), 'recovery_sha256': recovery['sha256']}
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('min_updater='+min_updater+'\n')
              for key, value in recovery_outputs.items():
                  output.write(key+'='+value+'\n')
          PY

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "package_path=$package_path" >> "$GITHUB_OUTPUT"
          echo "size=$actual_size" >> "$GITHUB_OUTPUT"
          echo "sha256=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "min_devhub=$min_devhub" >> "$GITHUB_OUTPUT"

      - name: Archive package in registry when reconstructed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '${{ steps.release.outputs.package_path }}'
          if ! git diff --cached --quiet; then
            git commit -m 'Archive immutable OSMINOG Chrome ${{ steps.release.outputs.version }} package [skip ci]'
            git push origin HEAD:main
          fi

      - name: Publish verified GitHub Release asset
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.release.outputs.version }}'
          tag="chrome-v$version"
          title="OSMINOG Chrome $version"
          notes=$(jq -r '.notes' '${{ steps.release.outputs.release_dir }}/release-v2.json')
          body=$(printf '%s\n\nPackage: `%s`\nSHA-256: `%s`\nSize: `%s` bytes\nMinimum Dev Hub: `%s`' \
            "$notes" \
            '${{ steps.release.outputs.package }}' \
            '${{ steps.release.outputs.sha256 }}' \
            '${{ steps.release.outputs.size }}' \
            '${{ steps.release.outputs.min_devhub }}')

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --target main --title "$title" --prerelease --notes "$body"
          else
            gh release create "$tag" --target main --title "$title" --prerelease --notes "$body"
          fi
          gh release upload "$tag" '${{ steps.release.outputs.package_path }}' --clobber

          asset=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" \
            --jq '.assets[] | select(.name == "${{ steps.release.outputs.package }}")')
          test -n "$asset"
          remote_size=$(printf '%s' "$asset" | jq -r '.size')
          remote_digest=$(printf '%s' "$asset" | jq -r '.digest // empty')
          test "$remote_size" = '${{ steps.release.outputs.size }}'
          if [ -n "$remote_digest" ]; then
            test "$remote_digest" = 'sha256:${{ steps.release.outputs.sha256 }}'
          fi

          recovery='${{ steps.release.outputs.recovery_filename }}'
          if [ -n "$recovery" ]; then
            gh release upload "$tag" '${{ steps.release.outputs.recovery_path }}' --clobber
            recovery_asset=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" \
              | jq --arg name "$recovery" -c '[.assets[] | select(.name == $name)] | if length == 1 then .[0] else error("missing/duplicate recovery asset") end')
            test "$(printf '%s' "$recovery_asset" | jq -r '.size')" = '${{ steps.release.outputs.recovery_size }}'
            recovery_digest=$(printf '%s' "$recovery_asset" | jq -r '.digest // empty')
            if [ -n "$recovery_digest" ]; then
              test "$recovery_digest" = 'sha256:${{ steps.release.outputs.recovery_sha256 }}'
            else
              verification_dir=$(mktemp -d)
              gh release download "$tag" --pattern "$recovery" --dir "$verification_dir"
              test "$(sha256sum "$verification_dir/$recovery" | awk '{print $1}')" = '${{ steps.release.outputs.recovery_sha256 }}'
            fi
          fi

      - name: Advance dev feed only after remote verification
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.release.outputs.version }}'
          package='${{ steps.release.outputs.package }}'
          encoded_package=$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$package")
          package_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/chrome-v${version}/${encoded_package}"
          notes_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/platforms/chrome-extension/releases/${version}/README.md"
          mkdir -p channels/dev

          python - "$version" "$package_url" "$notes_url" <<'PY'
          import json, pathlib, sys, urllib.parse
          sys.path.insert(0, 'tools')
          from import_verified_chrome_ci import minimum_updater, validate_recovery_request
          from datetime import datetime, timezone
          version, package_url, notes_url = sys.argv[1:4]
          meta_path = pathlib.Path(f'platforms/chrome-extension/releases/{version}/release-v2.json')
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          meta['publishedAt'] = now
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          feed = {
              'schema': 'osminog-update-feed-envelope/v1',
              'signed': {
                  'schema': 'osminog-update-feed/v2',
                  'product': 'OSMINOG',
                  'platform': 'chrome-extension',
                  'channel': 'dev',
                  'generatedAt': now,
                  'status': 'active',
                  'latest': {
                      'version': version,
                      'kind': 'full-package',
                      'packageUrl': package_url,
                      'size': meta['size'],
                      'sha256': meta['sha256'],
                      'manifestVersion': meta['manifestVersion'],
                      'fixedExtensionKeyRequired': True,
                      'minDevHubVersion': meta['minDevHubVersion'],
                      'minUpdaterVersion': minimum_updater(meta, version),
                      'runtimeVerified': meta.get('runtimeVerified', False),
                      'ciVerified': meta.get('ciVerified', False),
                      'notesUrl': notes_url,
                      'publishedAt': now,
                  }
              },
              'signature': None
          }
          if meta.get('recovery'):
              recovery = validate_recovery_request(meta['recovery'])
              recovery['url'] = package_url.rsplit('/', 1)[0]+'/'+urllib.parse.quote(recovery['filename'])
              feed['signed']['latest']['recovery'] = recovery
          pathlib.Path('channels/dev/chrome-extension.json').write_text(
              json.dumps(feed, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channels/dev/chrome-extension.json '${{ steps.release.outputs.release_dir }}/release-v2.json'
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Chrome dev feed to ${{ steps.release.outputs.version }} [skip ci]'
            git push origin HEAD:main
          fi

      - name: Final public feed verification
        shell: bash
        run: |
          set -euo pipefail
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/channels/dev/chrome-extension.json"
          verified=false
          for attempt in $(seq 1 30); do
            if payload=$(curl -fsSL --max-time 15 "$raw"); then
              latest=$(printf '%s' "$payload" | jq -r '.signed.latest.version')
              sha=$(printf '%s' "$payload" | jq -r '.signed.latest.sha256')
              min_updater=$(printf '%s' "$payload" | jq -r '.signed.latest.minUpdaterVersion // "1.0.0"')
              recovery_sha=$(printf '%s' "$payload" | jq -r '.signed.latest.recovery.sha256 // empty')
              if [ "$latest" = '${{ steps.release.outputs.version }}' ] && [ "$sha" = '${{ steps.release.outputs.sha256 }}' ] \
                && [ "$min_updater" = '${{ steps.release.outputs.min_updater }}' ] \
                && [ "$recovery_sha" = '${{ steps.release.outputs.recovery_sha256 }}' ]; then
                verified=true
                break
              fi
            fi
            echo "Waiting for public feed propagation ($attempt/30)"
            sleep 10
          done
          test "$verified" = true
          echo "OSMINOG Chrome dev feed safely advanced to $latest"
